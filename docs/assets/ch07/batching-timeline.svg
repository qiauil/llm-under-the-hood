<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Static Batching与Continuous Batching的四轮slot对比</title>
  <desc id="desc">最大三个slot。静态批处理中A运行四轮，B两轮，C一轮，之后空槽不能补位，利用率为7/12；连续批处理中C和B完成后D和E在轮末补位，四轮占用3、3、3、1个slot，利用率为5/6。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.cell{stroke:#334155;stroke-width:2}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="55" class="h">同一组请求，成员锁定与轮末补位</text>
  <g text-anchor="middle" class="t"><text x="300" y="105">Static：A/B/C 锁定到最长请求结束</text><text x="900" y="105">Continuous：每轮结束重新形成成员</text></g>
  <g text-anchor="middle" class="s">
    <text x="170" y="150">Round 1</text><text x="270" y="150">Round 2</text><text x="370" y="150">Round 3</text><text x="470" y="150">Round 4</text>
    <text x="770" y="150">Round 1</text><text x="870" y="150">Round 2</text><text x="970" y="150">Round 3</text><text x="1070" y="150">Round 4</text>
  </g>
  <g class="cell" text-anchor="middle">
    <g fill="#bfdbfe"><rect x="120" y="175" width="90" height="70" rx="10"/><rect x="220" y="175" width="90" height="70" rx="10"/><rect x="320" y="175" width="90" height="70" rx="10"/><rect x="420" y="175" width="90" height="70" rx="10"/></g>
    <g fill="#bbf7d0"><rect x="120" y="255" width="90" height="70" rx="10"/><rect x="220" y="255" width="90" height="70" rx="10"/></g>
    <g fill="#fed7aa"><rect x="120" y="335" width="90" height="70" rx="10"/></g>
    <g fill="#e2e8f0" stroke-dasharray="7 6"><rect x="320" y="255" width="90" height="70" rx="10"/><rect x="420" y="255" width="90" height="70" rx="10"/><rect x="220" y="335" width="90" height="70" rx="10"/><rect x="320" y="335" width="90" height="70" rx="10"/><rect x="420" y="335" width="90" height="70" rx="10"/></g>
    <g class="t"><text x="165" y="218">A</text><text x="265" y="218">A</text><text x="365" y="218">A</text><text x="465" y="218">A</text><text x="165" y="298">B</text><text x="265" y="298">B</text><text x="165" y="378">C</text></g>
    <g class="s" fill="#64748b"><text x="365" y="298">空</text><text x="465" y="298">空</text><text x="265" y="378">空</text><text x="365" y="378">空</text><text x="465" y="378">空</text></g>
  </g>
  <text x="315" y="455" text-anchor="middle" class="h" fill="#c2410c">η = 7 / 12</text><text x="315" y="490" text-anchor="middle" class="s">完成的 slot 不能让 D/E 进入</text>
  <g class="cell" text-anchor="middle">
    <g fill="#bfdbfe"><rect x="720" y="175" width="90" height="70" rx="10"/><rect x="820" y="175" width="90" height="70" rx="10"/><rect x="920" y="175" width="90" height="70" rx="10"/><rect x="1020" y="175" width="90" height="70" rx="10"/></g>
    <g fill="#bbf7d0"><rect x="720" y="255" width="90" height="70" rx="10"/><rect x="820" y="255" width="90" height="70" rx="10"/></g>
    <g fill="#fed7aa"><rect x="720" y="335" width="90" height="70" rx="10"/></g>
    <g fill="#ddd6fe"><rect x="920" y="255" width="90" height="70" rx="10"/><rect x="820" y="335" width="90" height="70" rx="10"/></g>
    <g fill="#fbcfe8"><rect x="920" y="335" width="90" height="70" rx="10"/></g>
    <g fill="#e2e8f0" stroke-dasharray="7 6"><rect x="1020" y="255" width="90" height="70" rx="10"/><rect x="1020" y="335" width="90" height="70" rx="10"/></g>
    <g class="t"><text x="765" y="218">A</text><text x="865" y="218">A</text><text x="965" y="218">A</text><text x="1065" y="218">A</text><text x="765" y="298">B</text><text x="865" y="298">B</text><text x="965" y="298">D</text><text x="765" y="378">C</text><text x="865" y="378">D</text><text x="965" y="378">E</text></g>
    <g class="s" fill="#64748b"><text x="1065" y="298">空</text><text x="1065" y="378">空</text></g>
  </g>
  <text x="915" y="455" text-anchor="middle" class="h" fill="#15803d">η = (3+3+3+1) / 12 = 5 / 6</text><text x="915" y="490" text-anchor="middle" class="s">假设 D/E 已到达，且 KV 容量允许补位</text>
  <rect x="115" y="555" width="970" height="105" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="596" text-anchor="middle" class="t" fill="#b91c1c">slot 是离散调度单位，不代表相同 FLOPs、KV bytes 或 iteration 时间</text>
  <text x="600" y="632" text-anchor="middle" class="s">Continuous Batching 提高补位机会；吞吐、尾延迟与公平仍要在同一到达过程下测量</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">无KV Cache与有KV Cache的重复计算对比</title>
  <desc id="desc">左侧无缓存为三个输出步骤重新处理长度4、5、6的完整前缀，共15个K/V投影位置；右侧缓存先处理4个Prompt位置，再各追加一个新位置，共6个投影位置，同时当前Query仍读取完整历史KV。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.box{stroke:#334155;stroke-width:2}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f8fafc"/>
  <text x="55" y="55" class="h">KV Cache 换掉历史重算，但没有换掉当前 Attention</text>
  <rect x="45" y="90" width="530" height="520" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="625" y="90" width="530" height="520" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="310" y="135" text-anchor="middle" class="h">无 Cache：每步重跑完整前缀</text>
  <text x="890" y="135" text-anchor="middle" class="h">有 Cache：历史 K/V 常驻</text>
  <g text-anchor="middle">
    <text x="105" y="205" class="t">输出 1</text><text x="105" y="305" class="t">输出 2</text><text x="105" y="405" class="t">输出 3</text>
    <g class="box"><rect x="175" y="170" width="280" height="55" rx="12" fill="#fed7aa"/><rect x="175" y="270" width="340" height="55" rx="12" fill="#fed7aa"/><rect x="175" y="370" width="400" height="55" rx="12" fill="#fed7aa"/></g>
    <text x="315" y="205" class="t">Prompt 4 个位置</text><text x="345" y="305" class="t">5 个完整前缀位置</text><text x="375" y="405" class="t">6 个完整前缀位置</text>
    <text x="310" y="485" class="h" fill="#c2410c">4 + 5 + 6 = 15</text><text x="310" y="520" class="s">K/V 投影位置账本</text>
  </g>
  <g text-anchor="middle">
    <rect x="680" y="170" width="300" height="72" rx="14" fill="#bbf7d0" class="box"/><text x="830" y="200" class="t">Prefill：Prompt 4 个位置</text><text x="830" y="228" class="s">写入逐层历史 K/V</text>
    <path d="M830 242V285" class="flow"/>
    <rect x="680" y="290" width="300" height="72" rx="14" fill="#dcfce7" class="box"/><text x="830" y="320" class="t">Decode：追加 1 个位置</text><text x="830" y="348" class="s">新 Query 读取全部历史 K/V</text>
    <path d="M830 362V405" class="flow"/>
    <rect x="680" y="410" width="300" height="72" rx="14" fill="#dcfce7" class="box"/><text x="830" y="440" class="t">Decode：再追加 1 个位置</text><text x="830" y="468" class="s">Cache 长度继续增长</text>
    <text x="890" y="535" class="h" fill="#15803d">4 + 1 + 1 = 6</text><text x="890" y="570" class="s">只省历史投影/前向；不省当前 Q/O/MLP</text>
  </g>
  <rect x="210" y="630" width="780" height="48" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="661" text-anchor="middle" class="t">2.5× 只属于这个投影位置账本，不是整模型墙钟加速比</text>
</svg>

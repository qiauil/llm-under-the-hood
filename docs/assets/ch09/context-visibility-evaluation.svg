<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">长上下文可见图与位置长度评测网格</title>
  <desc id="desc">左侧并列Full、Sliding Window和Sparse三种因果可见图。右侧用总长度和证据位置组成二维评测网格，强调每格均应记录质量与失败类型。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.edge{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#a)}.far{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}.node{fill:#fff;stroke:#334155;stroke-width:2}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="50" y="55" class="h">先画“哪些 Key 可见”，再测“哪些证据可用”</text>
  <rect x="45" y="95" width="650" height="610" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="75" y="140" class="h">可见边：同一当前 Query q</text>
  <text x="75" y="205" class="h">Full</text><text x="75" y="235" class="s">全部历史位置一步可达</text>
  <g><circle cx="285" cy="215" r="19" class="node"/><circle cx="355" cy="215" r="19" class="node"/><circle cx="425" cy="215" r="19" class="node"/><circle cx="495" cy="215" r="19" class="node"/><circle cx="565" cy="215" r="19" class="node"/><circle cx="635" cy="215" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/></g><path d="M300 205L610 205M370 211L610 211M440 217L610 217M510 223L610 223M580 229L610 229" class="edge"/><text x="635" y="221" text-anchor="middle" class="s">q</text>
  <text x="75" y="355" class="h">Sliding Window</text><text x="75" y="385" class="s">只保留最近 w 个位置</text>
  <g><circle cx="285" cy="365" r="19" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><circle cx="355" cy="365" r="19" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><circle cx="425" cy="365" r="19" class="node"/><circle cx="495" cy="365" r="19" class="node"/><circle cx="565" cy="365" r="19" class="node"/><circle cx="635" cy="365" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/></g><path d="M440 355L610 355M510 365L610 365M580 375L610 375" class="edge"/><text x="635" y="371" text-anchor="middle" class="s">q</text>
  <text x="75" y="505" class="h">Sparse</text><text x="75" y="535" class="s">局部边 + 设计出的远距离边</text>
  <g><circle cx="285" cy="515" r="19" class="node"/><circle cx="355" cy="515" r="19" class="node"/><circle cx="425" cy="515" r="19" class="node"/><circle cx="495" cy="515" r="19" class="node"/><circle cx="565" cy="515" r="19" class="node"/><circle cx="635" cy="515" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/></g><path d="M510 505L610 505M580 515L610 515" class="edge"/><path d="M300 500Q450 440 610 500M370 525Q490 585 610 525" class="far"/><text x="635" y="521" text-anchor="middle" class="s">q</text>
  <rect x="90" y="610" width="560" height="58" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="370" y="647" text-anchor="middle" class="t">边更少 ≠ 任务所需路径仍然足够</text>
  <rect x="730" y="95" width="425" height="610" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="760" y="140" class="h">质量出口：位置 × 长度</text><text x="775" y="205" class="t">证据位置 p</text>
  <g stroke="#64748b" stroke-width="2"><rect x="850" y="180" width="80" height="80" fill="#dcfce7"/><rect x="930" y="180" width="80" height="80" fill="#dcfce7"/><rect x="1010" y="180" width="80" height="80" fill="#fef3c7"/><rect x="850" y="260" width="80" height="80" fill="#dcfce7"/><rect x="930" y="260" width="80" height="80" fill="#fef3c7"/><rect x="1010" y="260" width="80" height="80" fill="#fee2e2"/><rect x="850" y="340" width="80" height="80" fill="#dcfce7"/><rect x="930" y="340" width="80" height="80" fill="#fef3c7"/><rect x="1010" y="340" width="80" height="80" fill="#fee2e2"/><rect x="850" y="420" width="80" height="80" fill="#dcfce7"/><rect x="930" y="420" width="80" height="80" fill="#dcfce7"/><rect x="1010" y="420" width="80" height="80" fill="#fef3c7"/></g>
  <text x="815" y="228" text-anchor="middle" class="s">开头</text><text x="815" y="308" text-anchor="middle" class="s">前中</text><text x="815" y="388" text-anchor="middle" class="s">后中</text><text x="815" y="468" text-anchor="middle" class="s">结尾</text><text x="890" y="535" text-anchor="middle" class="s">短</text><text x="970" y="535" text-anchor="middle" class="s">中</text><text x="1050" y="535" text-anchor="middle" class="s">长</text><text x="925" y="565" text-anchor="middle" class="t">总长度 T →</text>
  <rect x="780" y="590" width="320" height="45" rx="12" fill="#f1f5f9"/><text x="940" y="619" text-anchor="middle" class="s">每格：质量 + 失败类型 + 资源</text><text x="760" y="680" class="s">颜色仅作示意；正式结果必须报告数值与阈值。</text>
</svg>

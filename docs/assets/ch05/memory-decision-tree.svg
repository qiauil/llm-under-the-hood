<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
  <title id="title">训练显存不足时的诊断决策树</title>
  <desc id="desc">从峰值快照和张量生命周期出发，先判断主要瓶颈是参数状态、单算子、普通激活、长上下文 Attention，还是 workspace、通信缓冲与碎片；分别导向 ZeRO/FSDP、TP/PP、降低 micro-batch 与重计算、CP/高性能 Attention，以及 Kernel、bucket 或分配器调整。所有路线最后都要验证正确性并重新测量峰值和步时。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e67e00"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:16px}.s{font-size:13px;fill:#46525e}.root{fill:#fff3e3;stroke:#e67e00;stroke-width:2.5}.blue{fill:#eaf2ff;stroke:#2166f3;stroke-width:2}.green{fill:#e8f8f0;stroke:#009b68;stroke-width:2}.red{fill:#fff0f2;stroke:#d33c55;stroke-width:2}.gray{fill:#f0f2f4;stroke:#68727d;stroke-width:2}.a{stroke:#e67e00;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="980" height="610" rx="18" fill="#f7f9fb"/><text x="490" y="38" text-anchor="middle" class="h">先定位峰值对象，再选择最小改动</text>
  <rect x="335" y="68" width="310" height="74" rx="14" class="root"/><text x="490" y="98" text-anchor="middle" class="t">峰值快照 + 生命周期账本</text><text x="490" y="124" text-anchor="middle" class="s">allocated / reserved、shape、时间点、对象类别</text>
  <g class="a"><path d="M490 142V178H100V210"/><path d="M490 142V178H294V210"/><path d="M490 142V210"/><path d="M490 142V178H686V210"/><path d="M490 142V178H880V210"/></g>
  <rect x="22" y="210" width="156" height="84" rx="12" class="blue"/><text x="100" y="238" text-anchor="middle" class="t">参数状态为主</text><text x="100" y="264" text-anchor="middle" class="s">权重 / 梯度 / Adam</text><text x="100" y="284" text-anchor="middle" class="s">复制导致越界</text>
  <rect x="216" y="210" width="156" height="84" rx="12" class="blue"/><text x="294" y="238" text-anchor="middle" class="t">单算子放不下</text><text x="294" y="264" text-anchor="middle" class="s">单层权重或局部张量</text><text x="294" y="284" text-anchor="middle" class="s">临时完整单元过大</text>
  <rect x="412" y="210" width="156" height="84" rx="12" class="green"/><text x="490" y="238" text-anchor="middle" class="t">普通激活为主</text><text x="490" y="264" text-anchor="middle" class="s">随 B、L 增长</text><text x="490" y="284" text-anchor="middle" class="s">跨前反向保存</text>
  <rect x="608" y="210" width="156" height="84" rx="12" class="green"/><text x="686" y="238" text-anchor="middle" class="t">长上下文为主</text><text x="686" y="264" text-anchor="middle" class="s">随 T / T² 增长</text><text x="686" y="284" text-anchor="middle" class="s">Attention 也越界</text>
  <rect x="802" y="210" width="156" height="84" rx="12" class="red"/><text x="880" y="238" text-anchor="middle" class="t">workspace / 碎片</text><text x="880" y="264" text-anchor="middle" class="s">Kernel、bucket</text><text x="880" y="284" text-anchor="middle" class="s">reserved ≫ allocated</text>
  <g class="a"><path d="M100 294V342"/><path d="M294 294V342"/><path d="M490 294V342"/><path d="M686 294V342"/><path d="M880 294V342"/></g>
  <rect x="22" y="342" width="156" height="112" rx="12" class="gray"/><text x="100" y="372" text-anchor="middle" class="t">ZeRO / FSDP</text><text x="100" y="398" text-anchor="middle" class="s">分散状态所有权</text><text x="100" y="420" text-anchor="middle" class="s">必要时 TP / PP</text><text x="100" y="442" text-anchor="middle" class="s">核对临时聚合峰值</text>
  <rect x="216" y="342" width="156" height="112" rx="12" class="gray"/><text x="294" y="372" text-anchor="middle" class="t">TP / PP</text><text x="294" y="398" text-anchor="middle" class="s">切矩阵或切层</text><text x="294" y="420" text-anchor="middle" class="s">检查整除和拓扑</text><text x="294" y="442" text-anchor="middle" class="s">不要只加 DP</text>
  <rect x="412" y="342" width="156" height="112" rx="12" class="gray"/><text x="490" y="372" text-anchor="middle" class="t">先降 micro-batch</text><text x="490" y="398" text-anchor="middle" class="s">累积保持 global batch</text><text x="490" y="420" text-anchor="middle" class="s">再选 SP / 选择性重算</text><text x="490" y="442" text-anchor="middle" class="s">最后完整 Block 重算</text>
  <rect x="608" y="342" width="156" height="112" rx="12" class="gray"/><text x="686" y="372" text-anchor="middle" class="t">CP / 高性能 Attention</text><text x="686" y="398" text-anchor="middle" class="s">分片上下文与 K/V</text><text x="686" y="420" text-anchor="middle" class="s">重算可能重复通信</text><text x="686" y="442" text-anchor="middle" class="s">第 6 章继续 IO 优化</text>
  <rect x="802" y="342" width="156" height="112" rx="12" class="gray"/><text x="880" y="372" text-anchor="middle" class="t">调整实现边界</text><text x="880" y="398" text-anchor="middle" class="s">Kernel / workspace</text><text x="880" y="420" text-anchor="middle" class="s">bucket / 预取窗口</text><text x="880" y="442" text-anchor="middle" class="s">分配器与碎片</text>
  <g class="a"><path d="M100 454V492H490V520"/><path d="M294 454V486H490V520"/><path d="M490 454V520"/><path d="M686 454V486H490V520"/><path d="M880 454V492H490V520"/></g>
  <rect x="286" y="520" width="408" height="62" rx="14" class="root"/><text x="490" y="546" text-anchor="middle" class="t">正确性对照 → 重测峰值、通信、bubble 与 step time</text><text x="490" y="569" text-anchor="middle" class="s">只保留能跨过容量门槛且端到端值得的最小改动</text>
</svg>

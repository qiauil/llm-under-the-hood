<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">四个 stage、四个 micro-batch 的 GPipe 与同步 1F1B 调度</title>
  <desc id="desc">上半图为 GPipe，所有前向完成后统一反向；下半图为同步 1F1B，预热后交替前向和反向。两者均在全部四个 micro-batch 反向完成后执行一次 optimizer step，灰色格表示空泡。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:16px}.s{font-size:13px;fill:#4b5864}.f{fill:#dceaff;stroke:#2166f3}.b{fill:#e5f7ef;stroke:#009b68}.i{fill:#edf0f2;stroke:#c4cbd1}.step{fill:#fff0dd;stroke:#e67e00;stroke-width:2}.g{stroke:#d7dde2;stroke-width:1}</style></defs>
  <rect width="980" height="560" rx="18" fill="#f8fafb"/>
  <text x="490" y="38" text-anchor="middle" class="h">同一更新边界，两种激活生命周期</text>
  <text x="22" y="85" class="t" font-weight="700">GPipe：fill 全部前向，再 drain 全部反向</text>
  <text x="22" y="320" class="t" font-weight="700">同步 1F1B：warmup 后尽量交替 F/B</text>
  <g transform="translate(92,104)">
    <g class="g"><path d="M0 0V160M72 0V160M144 0V160M216 0V160M288 0V160M360 0V160M432 0V160M504 0V160M576 0V160M648 0V160M720 0V160M792 0V160"/><path d="M0 0H792M0 40H792M0 80H792M0 120H792M0 160H792"/></g>
    <g class="t" text-anchor="end"><text x="-10" y="26">S0</text><text x="-10" y="66">S1</text><text x="-10" y="106">S2</text><text x="-10" y="146">S3</text></g>
    <g class="f"><rect x="0" y="2" width="70" height="36"/><rect x="72" y="2" width="70" height="36"/><rect x="144" y="2" width="70" height="36"/><rect x="216" y="2" width="70" height="36"/><rect x="72" y="42" width="70" height="36"/><rect x="144" y="42" width="70" height="36"/><rect x="216" y="42" width="70" height="36"/><rect x="288" y="42" width="70" height="36"/><rect x="144" y="82" width="70" height="36"/><rect x="216" y="82" width="70" height="36"/><rect x="288" y="82" width="70" height="36"/><rect x="360" y="82" width="70" height="36"/><rect x="216" y="122" width="70" height="36"/><rect x="288" y="122" width="70" height="36"/><rect x="360" y="122" width="70" height="36"/><rect x="432" y="122" width="70" height="36"/></g>
    <g class="b"><rect x="720" y="2" width="70" height="36"/><rect x="648" y="2" width="70" height="36"/><rect x="576" y="2" width="70" height="36"/><rect x="504" y="2" width="70" height="36"/><rect x="648" y="42" width="70" height="36"/><rect x="576" y="42" width="70" height="36"/><rect x="504" y="42" width="70" height="36"/><rect x="432" y="42" width="70" height="36"/><rect x="576" y="82" width="70" height="36"/><rect x="504" y="82" width="70" height="36"/><rect x="432" y="82" width="70" height="36"/><rect x="360" y="82" width="70" height="36"/><rect x="504" y="122" width="70" height="36"/><rect x="576" y="122" width="70" height="36"/><rect x="648" y="122" width="70" height="36"/><rect x="720" y="122" width="70" height="36"/></g>
  </g>
  <g transform="translate(92,338)">
    <g class="g"><path d="M0 0V160M72 0V160M144 0V160M216 0V160M288 0V160M360 0V160M432 0V160M504 0V160M576 0V160M648 0V160M720 0V160M792 0V160"/><path d="M0 0H792M0 40H792M0 80H792M0 120H792M0 160H792"/></g>
    <g class="t" text-anchor="end"><text x="-10" y="26">S0</text><text x="-10" y="66">S1</text><text x="-10" y="106">S2</text><text x="-10" y="146">S3</text></g>
    <g class="f"><rect x="0" y="2" width="70" height="36"/><rect x="72" y="2" width="70" height="36"/><rect x="144" y="2" width="70" height="36"/><rect x="216" y="2" width="70" height="36"/><rect x="72" y="42" width="70" height="36"/><rect x="144" y="42" width="70" height="36"/><rect x="216" y="42" width="70" height="36"/><rect x="288" y="42" width="70" height="36"/><rect x="144" y="82" width="70" height="36"/><rect x="216" y="82" width="70" height="36"/><rect x="360" y="82" width="70" height="36"/><rect x="432" y="82" width="70" height="36"/><rect x="216" y="122" width="70" height="36"/><rect x="360" y="122" width="70" height="36"/><rect x="504" y="122" width="70" height="36"/><rect x="648" y="122" width="70" height="36"/></g>
    <g class="b"><rect x="720" y="2" width="70" height="36"/><rect x="648" y="2" width="70" height="36"/><rect x="576" y="2" width="70" height="36"/><rect x="504" y="2" width="70" height="36"/><rect x="648" y="42" width="70" height="36"/><rect x="576" y="42" width="70" height="36"/><rect x="504" y="42" width="70" height="36"/><rect x="432" y="42" width="70" height="36"/><rect x="576" y="82" width="70" height="36"/><rect x="504" y="82" width="70" height="36"/><rect x="432" y="82" width="70" height="36"/><rect x="288" y="82" width="70" height="36"/><rect x="720" y="122" width="70" height="36"/><rect x="576" y="122" width="70" height="36"/><rect x="432" y="122" width="70" height="36"/><rect x="288" y="122" width="70" height="36"/></g>
  </g>
  <g class="s"><text x="100" y="286">蓝：前向 F</text><text x="190" y="286">绿：反向 B</text><text x="300" y="286">灰/空白：stage 空闲；示意格不用于性能实测</text></g>
  <rect x="724" y="512" width="230" height="34" rx="9" class="step"/><text x="839" y="535" text-anchor="middle" class="t">全部 B 完成 → 唯一 optimizer step</text>
</svg>

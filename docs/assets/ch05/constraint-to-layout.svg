<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">从约束证据到分布式布局</title>
  <desc id="desc">容量、完成时间、单算子可执行性和负载不均四类约束，经过输入和目标布局判断，分别导向DP、ZeRO/FSDP、TP、PP、SP/CP和EP。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker>
    <style>.t{font:700 23px system-ui,sans-serif;fill:#172033}.h{font:700 16px system-ui,sans-serif;fill:#172033}.b{font:13px system-ui,sans-serif;fill:#334155}.s{font:11px system-ui,sans-serif;fill:#475569}.arr{stroke:#d97706;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1000" height="520" rx="20" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" class="t">先证明哪里受限，再决定切什么</text>
  <text x="120" y="78" text-anchor="middle" class="h">证据门</text>
  <g stroke-width="2">
    <rect x="25" y="98" width="190" height="76" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="25" y="188" width="190" height="76" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="25" y="278" width="190" height="76" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <rect x="25" y="368" width="190" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  </g>
  <g text-anchor="middle"><text x="120" y="126" class="h">容量</text><text x="120" y="151" class="s">状态 / 激活 / 临时峰值</text><text x="120" y="216" class="h">完成时间</text><text x="120" y="241" class="s">Token 预算能否按期完成</text><text x="120" y="306" class="h">单算子可执行性</text><text x="120" y="331" class="s">单层矩阵或上下文放不下</text><text x="120" y="396" class="h">负载不均</text><text x="120" y="421" class="s">最慢 rank / stage / 专家决定步时</text></g>
  <path d="M215 136H315M215 226H315M215 316H315M215 406H315" class="arr"/>
  <rect x="320" y="132" width="300" height="240" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="165" text-anchor="middle" class="h">先写布局，不先写算法名</text>
  <text x="470" y="205" text-anchor="middle" class="b">调用前：每个 rank 持有什么？</text>
  <text x="470" y="241" text-anchor="middle" class="b">调用后：每个 rank 需要什么？</text>
  <text x="470" y="277" text-anchor="middle" class="b">是否归约？结果复制还是分片？</text>
  <text x="470" y="313" text-anchor="middle" class="b">消息多大？哪个组？经过哪条链路？</text>
  <rect x="365" y="332" width="210" height="25" rx="12" fill="#dbeafe"/><text x="470" y="349" text-anchor="middle" class="s">collective 语义 → 物理实现</text>
  <path d="M620 252H675" class="arr"/>
  <text x="830" y="78" text-anchor="middle" class="h">切分对象</text>
  <g stroke-width="2"><rect x="680" y="98" width="300" height="58" rx="12" fill="#ecfdf5" stroke="#059669"/><rect x="680" y="168" width="300" height="58" rx="12" fill="#ecfdf5" stroke="#059669"/><rect x="680" y="238" width="300" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5"/><rect x="680" y="308" width="300" height="58" rx="12" fill="#fff7ed" stroke="#ea580c"/><rect x="680" y="378" width="300" height="58" rx="12" fill="#f5f3ff" stroke="#7c3aed"/></g>
  <g><text x="700" y="123" class="h">DP：切独立样本</text><text x="700" y="145" class="s">完整副本同步同一步</text><text x="700" y="193" class="h">ZeRO / FSDP：切状态所有权</text><text x="700" y="215" class="s">计算时可临时重建完整单元</text><text x="700" y="263" class="h">TP / PP：切张量或层</text><text x="700" y="285" class="s">解决单算子或深度容量</text><text x="700" y="333" class="h">SP / CP：切序列激活</text><text x="700" y="355" class="s">分清逐 Token 区域与跨 Token Attention</text><text x="700" y="403" class="h">EP：切专家编号</text><text x="700" y="425" class="s">用 All-to-All 路由副本，防止热点</text></g>
  <text x="500" y="490" text-anchor="middle" class="b">每种策略都回答：切什么 · 每卡保留什么 · 通信什么 · 何时不划算</text>
</svg>

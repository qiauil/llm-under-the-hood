<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">DDP与ZeRO三阶段的常驻状态布局</title>
  <desc id="desc">对比四rank中DDP复制权重、梯度和optimizer状态，ZeRO-1分片optimizer、ZeRO-2再分片梯度、ZeRO-3再分片权重，并强调ZeRO-3计算当前单元时会临时All-Gather完整参数。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker><style>.t{font:700 23px system-ui,sans-serif;fill:#172033}.h{font:700 16px system-ui,sans-serif;fill:#172033}.b{font:13px system-ui,sans-serif;fill:#334155}.s{font:11px system-ui,sans-serif;fill:#475569}.arr{stroke:#d97706;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="650" rx="20" fill="#f8fafc"/><text x="550" y="38" text-anchor="middle" class="t">分片改变常驻所有权，不是把所有峰值都除以 rank 数</text>
  <text x="175" y="76" text-anchor="middle" class="h">DDP</text><text x="425" y="76" text-anchor="middle" class="h">ZeRO-1</text><text x="675" y="76" text-anchor="middle" class="h">ZeRO-2</text><text x="925" y="76" text-anchor="middle" class="h">ZeRO-3</text>
  <g transform="translate(35,95)">
    <g id="full"><rect width="280" height="350" rx="14" fill="#fff" stroke="#94a3b8"/><g transform="translate(20,32)"><rect width="240" height="52" rx="9" fill="#60a5fa"/><text x="120" y="31" text-anchor="middle" class="b">权重：完整</text><rect y="68" width="240" height="52" rx="9" fill="#86efac"/><text x="120" y="99" text-anchor="middle" class="b">梯度：完整</text><rect y="136" width="240" height="150" rx="9" fill="#c4b5fd"/><text x="120" y="169" text-anchor="middle" class="b">optimizer：完整</text><text x="120" y="195" text-anchor="middle" class="s">m / v</text><text x="120" y="222" text-anchor="middle" class="s">每 rank 都复制</text><text x="120" y="260" text-anchor="middle" class="h">12P</text></g></g>
  </g>
  <g transform="translate(285,95)"><rect width="280" height="350" rx="14" fill="#fff" stroke="#059669"/><g transform="translate(20,32)"><rect width="240" height="52" rx="9" fill="#60a5fa"/><text x="120" y="31" text-anchor="middle" class="b">权重：完整</text><rect y="68" width="240" height="52" rx="9" fill="#86efac"/><text x="120" y="99" text-anchor="middle" class="b">梯度：完整</text><g fill="#c4b5fd" stroke="#7c3aed"><rect y="136" width="54" height="95" rx="8"/><rect x="62" y="136" width="54" height="95" rx="8"/><rect x="124" y="136" width="54" height="95" rx="8"/><rect x="186" y="136" width="54" height="95" rx="8"/></g><text x="120" y="255" text-anchor="middle" class="s">optimizer 按 rank 分片</text><text x="120" y="287" text-anchor="middle" class="h">4P + 8P/q</text></g></g>
  <g transform="translate(535,95)"><rect width="280" height="350" rx="14" fill="#fff" stroke="#059669"/><g transform="translate(20,32)"><rect width="240" height="52" rx="9" fill="#60a5fa"/><text x="120" y="31" text-anchor="middle" class="b">权重：完整</text><g fill="#86efac" stroke="#16a34a"><rect y="68" width="54" height="52" rx="8"/><rect x="62" y="68" width="54" height="52" rx="8"/><rect x="124" y="68" width="54" height="52" rx="8"/><rect x="186" y="68" width="54" height="52" rx="8"/></g><g fill="#c4b5fd" stroke="#7c3aed"><rect y="136" width="54" height="95" rx="8"/><rect x="62" y="136" width="54" height="95" rx="8"/><rect x="124" y="136" width="54" height="95" rx="8"/><rect x="186" y="136" width="54" height="95" rx="8"/></g><text x="120" y="255" text-anchor="middle" class="s">梯度 + optimizer 分片</text><text x="120" y="287" text-anchor="middle" class="h">2P + 10P/q</text></g></g>
  <g transform="translate(785,95)"><rect width="280" height="350" rx="14" fill="#fff" stroke="#4f46e5"/><g transform="translate(20,32)"><g fill="#60a5fa" stroke="#2563eb"><rect width="54" height="52" rx="8"/><rect x="62" width="54" height="52" rx="8"/><rect x="124" width="54" height="52" rx="8"/><rect x="186" width="54" height="52" rx="8"/></g><g fill="#86efac" stroke="#16a34a"><rect y="68" width="54" height="52" rx="8"/><rect x="62" y="68" width="54" height="52" rx="8"/><rect x="124" y="68" width="54" height="52" rx="8"/><rect x="186" y="68" width="54" height="52" rx="8"/></g><g fill="#c4b5fd" stroke="#7c3aed"><rect y="136" width="54" height="95" rx="8"/><rect x="62" y="136" width="54" height="95" rx="8"/><rect x="124" y="136" width="54" height="95" rx="8"/><rect x="186" y="136" width="54" height="95" rx="8"/></g><text x="120" y="255" text-anchor="middle" class="s">权重 + 梯度 + optimizer 分片</text><text x="120" y="287" text-anchor="middle" class="h">12P/q</text></g></g>
  <rect x="640" y="485" width="400" height="105" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="840" y="514" text-anchor="middle" class="h">ZeRO-3 当前计算单元</text><text x="840" y="542" text-anchor="middle" class="b">参数分片 → All-Gather 临时完整参数</text><text x="840" y="567" text-anchor="middle" class="s">计算后释放 / reshard；激活、buffer、workspace 另计</text><path d="M925 445V480" class="arr"/>
  <g transform="translate(55,500)"><rect width="470" height="70" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="235" y="28" text-anchor="middle" class="b">图中 4 小片表示 4-rank 所有权</text><text x="235" y="50" text-anchor="middle" class="s">不可整除、padding、元数据和通信工作区未画入</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">三种子词方法比较</title>
  <desc id="desc">同一输入 ababc 分别进入 BPE、WordPiece 和 Unigram。三条路径区分训练所得对象与编码时的选择方式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}
      .box{stroke-width:2.5}.flow{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="22" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">固定输入，比较“学到什么”与“怎样编码”</text>
  <rect x="470" y="70" width="260" height="72" rx="16" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="600" y="116" text-anchor="middle" class="label">输入：ababc</text>

  <path d="M600 142 V170 H205 V205" class="flow"/><path d="M600 142 V205" class="flow"/><path d="M600 142 V170 H995 V205" class="flow"/>

  <rect x="55" y="205" width="300" height="350" rx="18" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="205" y="246" text-anchor="middle" class="label">BPE</text>
  <text x="82" y="288" class="small">训练得到</text><text x="82" y="318" class="body">有顺序的合并规则</text>
  <line x1="82" y1="340" x2="328" y2="340" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="82" y="378" class="small">编码时</text><text x="82" y="408" class="body">按顺序重放规则</text>
  <rect x="83" y="438" width="244" height="72" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="205" y="468" text-anchor="middle" class="small">a b a b c</text><text x="205" y="496" text-anchor="middle" class="small">→ ab ab c → abab c</text>

  <rect x="450" y="205" width="300" height="350" rx="18" fill="#fff7ed" stroke="#d97706" class="box"/>
  <text x="600" y="246" text-anchor="middle" class="label">WordPiece</text>
  <text x="477" y="288" class="small">训练得到</text><text x="477" y="318" class="body">固定子词词表</text>
  <line x1="477" y1="340" x2="723" y2="340" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="477" y="378" class="small">编码时（BERT 实现）</text><text x="477" y="408" class="body">从左到右最长匹配</text>
  <rect x="478" y="438" width="244" height="72" rx="12" fill="#ffffff" stroke="#fdba74"/>
  <text x="600" y="468" text-anchor="middle" class="small">先找最长前缀</text><text x="600" y="496" text-anchor="middle" class="small">再处理剩余字符串</text>

  <rect x="845" y="205" width="300" height="350" rx="18" fill="#ecfdf5" stroke="#16a34a" class="box"/>
  <text x="995" y="246" text-anchor="middle" class="label">Unigram</text>
  <text x="872" y="288" class="small">训练得到</text><text x="872" y="318" class="body">带概率的候选片段</text>
  <line x1="872" y1="340" x2="1118" y2="340" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="872" y="378" class="small">编码时</text><text x="872" y="408" class="body">比较整条切分路径</text>
  <rect x="873" y="438" width="244" height="72" rx="12" fill="#ffffff" stroke="#86efac"/>
  <text x="995" y="468" text-anchor="middle" class="small">ab | ab | c</text><text x="995" y="496" text-anchor="middle" class="small">a | b | ab | c</text>
  <text x="600" y="595" text-anchor="middle" class="small">图中切分用于说明算法机制；实际结果由各自完整配置决定。</text>
</svg>

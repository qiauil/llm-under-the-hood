<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">采样控制对同一分布的影响</title>
  <desc id="desc">四个柱状图依次显示原分布、温度零点五、Top-k 等于二、Top-p 等于零点八的概率。</desc>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.axis{stroke:#64748b;stroke-width:2}.keep{fill:#2563eb}.cut{fill:#cbd5e1}.hot{fill:#16a34a}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style>
  <rect width="1200" height="610" rx="22" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="h">同一四项分布：改变形状，或改变候选集合</text>
  <!-- panel 1 -->
  <rect x="30" y="70" width="270" height="470" rx="16" class="panel"/><text x="165" y="108" text-anchor="middle" class="h">原分布</text><text x="165" y="136" text-anchor="middle" class="s">τ = 1，未截断</text>
  <line x1="65" y1="455" x2="270" y2="455" class="axis"/>
  <rect x="78" y="251" width="34" height="204" class="keep"/><rect x="130" y="370" width="34" height="85" class="keep"/><rect x="182" y="421" width="34" height="34" class="keep"/><rect x="234" y="438" width="34" height="17" class="keep"/>
  <text x="95" y="242" text-anchor="middle" class="s">.60</text><text x="147" y="361" text-anchor="middle" class="s">.25</text><text x="199" y="412" text-anchor="middle" class="s">.10</text><text x="251" y="429" text-anchor="middle" class="s">.05</text>
  <text x="95" y="482" text-anchor="middle" class="t">A</text><text x="147" y="482" text-anchor="middle" class="t">B</text><text x="199" y="482" text-anchor="middle" class="t">C</text><text x="251" y="482" text-anchor="middle" class="t">D</text>
  <!-- panel 2 -->
  <rect x="320" y="70" width="270" height="470" rx="16" class="panel"/><text x="455" y="108" text-anchor="middle" class="h">降低温度</text><text x="455" y="136" text-anchor="middle" class="s">τ = 0.5，概率正比于原概率平方</text>
  <line x1="355" y1="455" x2="560" y2="455" class="axis"/>
  <rect x="368" y="174" width="34" height="281" class="hot"/><rect x="420" y="406" width="34" height="49" class="hot"/><rect x="472" y="447" width="34" height="8" class="hot"/><rect x="524" y="453" width="34" height="2" class="hot"/>
  <text x="385" y="165" text-anchor="middle" class="s">.828</text><text x="437" y="397" text-anchor="middle" class="s">.144</text><text x="489" y="438" text-anchor="middle" class="s">.023</text><text x="541" y="444" text-anchor="middle" class="s">.006</text>
  <text x="385" y="482" text-anchor="middle" class="t">A</text><text x="437" y="482" text-anchor="middle" class="t">B</text><text x="489" y="482" text-anchor="middle" class="t">C</text><text x="541" y="482" text-anchor="middle" class="t">D</text>
  <!-- panel 3 -->
  <rect x="610" y="70" width="270" height="470" rx="16" class="panel"/><text x="745" y="108" text-anchor="middle" class="h">Top-k = 2</text><text x="745" y="136" text-anchor="middle" class="s">固定保留两个候选，再归一化</text>
  <line x1="645" y1="455" x2="850" y2="455" class="axis"/>
  <rect x="658" y="215" width="34" height="240" class="keep"/><rect x="710" y="355" width="34" height="100" class="keep"/><rect x="762" y="451" width="34" height="4" class="cut"/><rect x="814" y="451" width="34" height="4" class="cut"/>
  <text x="675" y="206" text-anchor="middle" class="s">.706</text><text x="727" y="346" text-anchor="middle" class="s">.294</text><text x="779" y="430" text-anchor="middle" class="s">删去</text><text x="831" y="430" text-anchor="middle" class="s">删去</text>
  <text x="675" y="482" text-anchor="middle" class="t">A</text><text x="727" y="482" text-anchor="middle" class="t">B</text><text x="779" y="482" text-anchor="middle" class="t">C</text><text x="831" y="482" text-anchor="middle" class="t">D</text>
  <!-- panel 4 -->
  <rect x="900" y="70" width="270" height="470" rx="16" class="panel"/><text x="1035" y="108" text-anchor="middle" class="h">Top-p = 0.8</text><text x="1035" y="136" text-anchor="middle" class="s">τ = 1；最短前缀累计到 0.85</text>
  <line x1="935" y1="455" x2="1140" y2="455" class="axis"/>
  <rect x="948" y="215" width="34" height="240" class="keep"/><rect x="1000" y="355" width="34" height="100" class="keep"/><rect x="1052" y="451" width="34" height="4" class="cut"/><rect x="1104" y="451" width="34" height="4" class="cut"/>
  <text x="965" y="206" text-anchor="middle" class="s">.706</text><text x="1017" y="346" text-anchor="middle" class="s">.294</text><text x="1069" y="430" text-anchor="middle" class="s">删去</text><text x="1121" y="430" text-anchor="middle" class="s">删去</text>
  <text x="965" y="482" text-anchor="middle" class="t">A</text><text x="1017" y="482" text-anchor="middle" class="t">B</text><text x="1069" y="482" text-anchor="middle" class="t">C</text><text x="1121" y="482" text-anchor="middle" class="t">D</text>
  <text x="600" y="580" text-anchor="middle" class="t">灰色表示被截断；柱高是截断并重新归一化后的采样概率。</text>
</svg>

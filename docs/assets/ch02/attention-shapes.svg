<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Attention 形状变化与因果可见性</title><desc id="desc">左侧追踪 X 到 Q/K/V、分数和输出的形状，右侧展示三位置因果掩码。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.b{stroke-width:2.5}.f{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="600" rx="22" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">一条 Attention 前向：轴怎么变，位置能看谁</text>
  <text x="325" y="86" text-anchor="middle" class="h">形状路径（B=2,T=3,d=8）</text><text x="915" y="86" text-anchor="middle" class="h">因果可见性（T=3）</text>
  <rect x="65" y="120" width="210" height="72" rx="14" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="170" y="151" text-anchor="middle" class="t">X</text><text x="170" y="177" text-anchor="middle" class="s">[2,3,8]</text>
  <path d="M275 156H335" class="f"/><rect x="335" y="105" width="270" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" class="b"/><text x="470" y="137" text-anchor="middle" class="t">线性投影并拆头</text><text x="470" y="166" text-anchor="middle" class="s">Q [2,3,2,4]</text><text x="470" y="190" text-anchor="middle" class="s">K/V [2,3,1,4]</text>
  <path d="M470 209V260" class="f"/><rect x="325" y="260" width="290" height="105" rx="14" fill="#fff7ed" stroke="#d97706" class="b"/><text x="470" y="294" text-anchor="middle" class="t">换轴到头内计算布局</text><text x="470" y="325" text-anchor="middle" class="s">Q [2,2,3,4]</text><text x="470" y="350" text-anchor="middle" class="s">K/V [2,1,3,4]</text>
  <path d="M325 312H245V425" class="f"/><rect x="90" y="425" width="310" height="92" rx="14" fill="#ecfdf5" stroke="#16a34a" class="b"/><text x="245" y="460" text-anchor="middle" class="t">每个 Q 头的 scores</text><text x="245" y="491" text-anchor="middle" class="s">[2,2,3,3] = [B,H,T,T]</text>
  <path d="M400 471H455" class="f"/><rect x="455" y="425" width="190" height="92" rx="14" fill="#ecfdf5" stroke="#16a34a" class="b"/><text x="550" y="460" text-anchor="middle" class="t">合并并投影</text><text x="550" y="491" text-anchor="middle" class="s">[2,3,8]</text>

  <text x="812" y="127" class="s">key →</text><text x="720" y="225" class="s" transform="rotate(-90 720 225)">query →</text>
  <g transform="translate(780,145)">
    <rect x="0" y="0" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/><rect x="105" y="0" width="105" height="105" fill="#e5e7eb" stroke="#94a3b8"/><rect x="210" y="0" width="105" height="105" fill="#e5e7eb" stroke="#94a3b8"/>
    <rect x="0" y="105" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/><rect x="105" y="105" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/><rect x="210" y="105" width="105" height="105" fill="#e5e7eb" stroke="#94a3b8"/>
    <rect x="0" y="210" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/><rect x="105" y="210" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/><rect x="210" y="210" width="105" height="105" fill="#dcfce7" stroke="#16a34a"/>
    <text x="52" y="62" text-anchor="middle" class="t">可见</text><text x="157" y="62" text-anchor="middle" class="t">未来</text><text x="262" y="62" text-anchor="middle" class="t">未来</text>
    <text x="52" y="167" text-anchor="middle" class="t">历史</text><text x="157" y="167" text-anchor="middle" class="t">可见</text><text x="262" y="167" text-anchor="middle" class="t">未来</text>
    <text x="52" y="272" text-anchor="middle" class="t">历史</text><text x="157" y="272" text-anchor="middle" class="t">历史</text><text x="262" y="272" text-anchor="middle" class="t">可见</text>
  </g>
  <text x="938" y="500" text-anchor="middle" class="t">绿色：j ≤ i；灰色：加 −∞ 后不进入 Softmax</text>
</svg>

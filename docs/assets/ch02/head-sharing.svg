<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">MHA、GQA 与 MQA 的 Query 到 KV 头映射</title><desc id="desc">八个 Query 头在 MHA 中对应八个 KV 头，在 GQA 中四个一组共享两个 KV 头，在 MQA 中共享一个 KV 头。</desc>

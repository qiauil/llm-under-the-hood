<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">可重放的预训练数据管线</title>
  <desc id="desc">数据从带来源标识的文档经过清洗、去重分割、混合、分词和Packing，每一步将证据写入manifest。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker><style>.t{font:700 22px system-ui,sans-serif;fill:#172033}.h{font:700 15px system-ui,sans-serif;fill:#172033}.b{font:12px system-ui,sans-serif;fill:#334155}.s{font:10.5px system-ui,sans-serif;fill:#475569}.arr{stroke:#d97706;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:1.6;stroke-dasharray:5 4}</style></defs>
  <rect width="960" height="470" rx="18" fill="#f8fafc"/>
  <text x="480" y="35" text-anchor="middle" class="t">数据流与证据流必须一起前进</text>
  <text x="30" y="86" class="h">数据流</text>
  <g stroke-width="2">
    <rect x="30" y="105" width="120" height="78" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <rect x="180" y="105" width="120" height="78" rx="12" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="330" y="105" width="135" height="78" rx="12" fill="#ecfdf5" stroke="#059669"/>
    <rect x="495" y="105" width="115" height="78" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="640" y="105" width="115" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="785" y="105" width="145" height="78" rx="12" fill="#fefce8" stroke="#ca8a04"/>
  </g>
  <g text-anchor="middle"><text x="90" y="133" class="h">带来源文档</text><text x="90" y="158" class="s">doc_id · 许可 · hash</text><text x="240" y="133" class="h">清洗</text><text x="240" y="158" class="s">解码 · 语言 · 质量</text><text x="397" y="133" class="h">去重与分割</text><text x="397" y="158" class="s">簇 → train/val/test</text><text x="552" y="133" class="h">混合</text><text x="552" y="158" class="s">qᵢ 与实际采样</text><text x="697" y="133" class="h">Tokenizer</text><text x="697" y="158" class="s">版本 · 边界</text><text x="857" y="133" class="h">Packing / 分片</text><text x="857" y="158" class="s">mask · position · shard</text></g>
  <path d="M150 144H178M300 144H328M465 144H493M610 144H638M755 144H783" class="arr"/>
  <text x="30" y="240" class="h">证据流</text>
  <rect x="30" y="260" width="900" height="125" rx="15" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <g class="dash"><line x1="90" y1="183" x2="90" y2="260"/><line x1="240" y1="183" x2="240" y2="260"/><line x1="397" y1="183" x2="397" y2="260"/><line x1="552" y1="183" x2="552" y2="260"/><line x1="697" y1="183" x2="697" y2="260"/><line x1="857" y1="183" x2="857" y2="260"/></g>
  <g text-anchor="middle"><text x="105" y="291" class="b">来源快照</text><text x="105" y="312" class="s">获取时间 · 使用条件</text><text x="250" y="291" class="b">规则与计数</text><text x="250" y="312" class="s">输入/删除/输出</text><text x="405" y="291" class="b">簇与分割清单</text><text x="405" y="312" class="s">污染匹配报告</text><text x="560" y="291" class="b">目标/实际混合</text><text x="560" y="312" class="s">覆盖轮数</text><text x="710" y="291" class="b">模型绑定版本</text><text x="710" y="312" class="s">词表 · 特殊 Token</text><text x="855" y="291" class="b">边界与分片清单</text><text x="855" y="312" class="s">checksum · 统计</text></g>
  <rect x="335" y="330" width="290" height="42" rx="21" fill="#e2e8f0" stroke="#475569"/>
  <text x="480" y="356" text-anchor="middle" class="h">manifest：版本 + 配置 hash + 全链路计数</text>
  <path d="M480 385V425" class="arr"/>
  <text x="480" y="450" text-anchor="middle" class="b">训练读取 Token 分片，同时保存可重放的数据位置</text>
</svg>

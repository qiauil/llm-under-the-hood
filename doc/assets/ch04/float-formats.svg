<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">浮点格式的范围与分辨率取舍</title>
  <desc id="desc">并列显示FP32、FP16、BF16和两种FP8的符号、指数与fraction位宽，并区分动态范围和1附近间距。</desc>
  <defs><style>.t{font:700 22px system-ui,sans-serif;fill:#172033}.h{font:700 15px system-ui,sans-serif;fill:#172033}.b{font:12px system-ui,sans-serif;fill:#334155}.s{font:10px system-ui,sans-serif;fill:#475569}.lab{font:700 12px ui-monospace,monospace;fill:#172033}</style></defs>
  <rect width="960" height="500" rx="18" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" class="t">指数位看范围，fraction 位看局部分辨率</text>
  <text x="125" y="82" text-anchor="middle" class="h">格式</text><text x="530" y="82" text-anchor="middle" class="h">位段（长度按位数比例）</text><text x="860" y="82" text-anchor="middle" class="h">1 附近间距</text>
  <g>
    <text x="125" y="126" text-anchor="middle" class="lab">FP32  1/8/23</text><rect x="210" y="105" width="18" height="32" fill="#ef4444"/><rect x="228" y="105" width="144" height="32" fill="#60a5fa"/><rect x="372" y="105" width="414" height="32" fill="#86efac"/><text x="860" y="126" text-anchor="middle" class="lab">2^-23</text>
    <text x="125" y="184" text-anchor="middle" class="lab">FP16  1/5/10</text><rect x="210" y="163" width="36" height="32" fill="#ef4444"/><rect x="246" y="163" width="180" height="32" fill="#60a5fa"/><rect x="426" y="163" width="360" height="32" fill="#86efac"/><text x="860" y="184" text-anchor="middle" class="lab">2^-10</text>
    <text x="125" y="242" text-anchor="middle" class="lab">BF16  1/8/7</text><rect x="210" y="221" width="36" height="32" fill="#ef4444"/><rect x="246" y="221" width="288" height="32" fill="#60a5fa"/><rect x="534" y="221" width="252" height="32" fill="#86efac"/><text x="860" y="242" text-anchor="middle" class="lab">2^-7</text>
    <text x="125" y="300" text-anchor="middle" class="lab">E4M3  1/4/3</text><rect x="210" y="279" width="72" height="32" fill="#ef4444"/><rect x="282" y="279" width="288" height="32" fill="#60a5fa"/><rect x="570" y="279" width="216" height="32" fill="#86efac"/><text x="860" y="300" text-anchor="middle" class="lab">2^-3</text>
    <text x="125" y="358" text-anchor="middle" class="lab">E5M2  1/5/2</text><rect x="210" y="337" width="72" height="32" fill="#ef4444"/><rect x="282" y="337" width="360" height="32" fill="#60a5fa"/><rect x="642" y="337" width="144" height="32" fill="#86efac"/><text x="860" y="358" text-anchor="middle" class="lab">2^-2</text>
  </g>
  <g class="s" text-anchor="middle"><text x="219" y="126" fill="#fff">s</text><text x="300" y="126">指数 8</text><text x="579" y="126">fraction 23</text><text x="228" y="184" fill="#fff">s</text><text x="336" y="184">指数 5</text><text x="606" y="184">fraction 10</text><text x="228" y="242" fill="#fff">s</text><text x="390" y="242">指数 8</text><text x="660" y="242">fraction 7</text></g>
  <rect x="95" y="405" width="770" height="50" rx="12" fill="#fff" stroke="#64748b"/>
  <circle cx="130" cy="430" r="8" fill="#60a5fa"/><text x="150" y="435" class="b">指数位更多 → 通常动态范围更宽</text>
  <circle cx="500" cy="430" r="8" fill="#86efac"/><text x="520" y="435" class="b">fraction 位更多 → 1 附近网格更细</text>
  <text x="480" y="482" text-anchor="middle" class="b">编码格式比较不等于 Kernel 支持、累加 dtype 或硬件性能比较</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">GPU 编程层级与数据路径</title>
  <desc id="desc">Grid中的Block分派到SM，线程组成Warp；数据从设备内存经L2和片上存储到执行管线。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker>
    <style>.t{font:700 22px system-ui,sans-serif;fill:#172033}.h{font:700 16px system-ui,sans-serif;fill:#172033}.b{font:13px system-ui,sans-serif;fill:#334155}.s{font:11px system-ui,sans-serif;fill:#475569}.arr{stroke:#d97706;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="960" height="500" rx="18" fill="#f8fafc"/>
  <text x="480" y="35" text-anchor="middle" class="t">编程层级与存储层级在 SM 上相遇</text>
  <rect x="35" y="65" width="260" height="205" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="165" y="92" text-anchor="middle" class="h">Grid</text>
  <g fill="#fff" stroke="#6366f1"><rect x="60" y="112" width="95" height="55" rx="9"/><rect x="175" y="112" width="95" height="55" rx="9"/><rect x="60" y="188" width="95" height="55" rx="9"/><rect x="175" y="188" width="95" height="55" rx="9"/></g>
  <g class="b" text-anchor="middle"><text x="107" y="144">Block 0</text><text x="222" y="144">Block 1</text><text x="107" y="220">Block 2</text><text x="222" y="220">Block 3</text></g>
  <path d="M295 135H345" class="arr"/><path d="M295 215H345" class="arr"/>
  <rect x="350" y="65" width="260" height="205" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" class="h">多个 SM 独立接收 Block</text>
  <rect x="375" y="110" width="210" height="62" rx="10" fill="#fff" stroke="#10b981"/>
  <text x="395" y="134" class="b">SM 0：Block 0</text><text x="395" y="156" class="s">Warp 0 · Warp 1 · …（每组 32 线程）</text>
  <rect x="375" y="188" width="210" height="62" rx="10" fill="#fff" stroke="#10b981"/>
  <text x="395" y="212" class="b">SM 1：Block 1</text><text x="395" y="234" class="s">Warp 调度 + 片上资源 + 执行管线</text>
  <path d="M610 135H660" class="arr"/><path d="M610 215H660" class="arr"/>
  <rect x="665" y="65" width="260" height="205" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="795" y="92" text-anchor="middle" class="h">SM 内的执行路径</text>
  <rect x="690" y="112" width="210" height="52" rx="9" fill="#fff" stroke="#fb923c"/>
  <text x="795" y="143" text-anchor="middle" class="b">CUDA Core / 常规算术管线</text>
  <rect x="690" y="184" width="210" height="52" rx="9" fill="#fff" stroke="#fb923c"/>
  <text x="795" y="215" text-anchor="middle" class="b">Tensor Core / MMA 路径</text>
  <text x="480" y="304" text-anchor="middle" class="h">数据路径：容量变小、距离变近，复用与资源压力同时增加</text>
  <rect x="35" y="335" width="160" height="72" rx="12" fill="#e2e8f0" stroke="#64748b"/><text x="115" y="365" text-anchor="middle" class="h">设备 DRAM</text><text x="115" y="388" text-anchor="middle" class="s">大容量 · 跨 Kernel</text>
  <path d="M195 371H255" class="arr"/>
  <rect x="260" y="335" width="130" height="72" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="325" y="365" text-anchor="middle" class="h">L2 Cache</text><text x="325" y="388" text-anchor="middle" class="s">设备范围</text>
  <path d="M390 371H450" class="arr"/>
  <rect x="455" y="325" width="195" height="92" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="552" y="353" text-anchor="middle" class="h">L1 / Shared Memory</text><text x="552" y="377" text-anchor="middle" class="s">SM / Block 附近</text><text x="552" y="399" text-anchor="middle" class="s">Tile 复用 · 需同步</text>
  <path d="M650 371H710" class="arr"/>
  <rect x="715" y="335" width="105" height="72" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="767" y="365" text-anchor="middle" class="h">Register</text><text x="767" y="388" text-anchor="middle" class="s">每线程</text>
  <path d="M820 371H880" class="arr"/>
  <circle cx="906" cy="371" r="26" fill="#fee2e2" stroke="#dc2626"/><text x="906" y="375" text-anchor="middle" class="h">算</text>
  <text x="480" y="458" text-anchor="middle" class="b">Block 数决定能否覆盖多个 SM；Tile 复用决定同一字节能支持多少运算</text>
</svg>

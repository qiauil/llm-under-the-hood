<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">顺序 Pre-RMSNorm Transformer Block</title><desc id="desc">X 经 RMSNorm 和 GQA 分支后加回得到 U，U 再经另一 RMSNorm 和 SwiGLU 分支后加回得到下一层 X。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:20px}.s{font-size:16px}.main{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}.branch{stroke:#d97706;stroke-width:3;fill:none;marker-end:url(#o)}.b{stroke-width:2.5}</style></defs>
  <rect width="1200" height="560" rx="22" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" class="h">顺序 Pre-RMSNorm：第二条支路从 U 出发</text>
  <path d="M80 300H1120" class="main"/><rect x="55" y="263" width="110" height="74" rx="13" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="110" y="294" text-anchor="middle" class="t">X⁽ℓ⁾</text><text x="110" y="321" text-anchor="middle" class="s">[B,T,d]</text>
  <circle cx="545" cy="300" r="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="545" y="308" text-anchor="middle" class="h">+</text><text x="600" y="340" class="t">U⁽ℓ⁾</text>
  <circle cx="1035" cy="300" r="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="1035" y="308" text-anchor="middle" class="h">+</text><text x="1068" y="340" class="t">X⁽ℓ+1⁾</text>
  <path d="M205 300V148H270" class="branch"/><rect x="270" y="105" width="165" height="86" rx="14" fill="#fff7ed" stroke="#d97706" class="b"/><text x="353" y="139" text-anchor="middle" class="t">RMSNormₐ</text><text x="353" y="168" text-anchor="middle" class="s">读取 X⁽ℓ⁾</text><path d="M435 148H475" class="branch"/><rect x="475" y="105" width="210" height="86" rx="14" fill="#ecfdf5" stroke="#16a34a" class="b"/><text x="580" y="136" text-anchor="middle" class="t">因果 RoPE GQA</text><text x="580" y="168" text-anchor="middle" class="s">跨可见位置混合</text><path d="M580 191V252H545" class="branch"/>
  <path d="M630 300V430H695" class="branch"/><rect x="695" y="387" width="165" height="86" rx="14" fill="#fff7ed" stroke="#d97706" class="b"/><text x="778" y="421" text-anchor="middle" class="t">RMSNormₘ</text><text x="778" y="450" text-anchor="middle" class="s">读取 U⁽ℓ⁾</text><path d="M860 430H900" class="branch"/><rect x="900" y="387" width="195" height="86" rx="14" fill="#ecfdf5" stroke="#16a34a" class="b"/><text x="998" y="421" text-anchor="middle" class="t">SwiGLU</text><text x="998" y="450" text-anchor="middle" class="s">逐位置变换</text><path d="M998 387V352H1035" class="branch"/>
  <rect x="350" y="495" width="500" height="46" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="600" y="525" text-anchor="middle" class="t">若 MLP 改读 Norm(X)，形状仍对，但已不是这个 Block</text>
</svg>

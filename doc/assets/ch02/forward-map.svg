<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer 端到端前向路径</title>
  <desc id="desc">Token ID 经过嵌入、L 个 Transformer Block、最终 RMSNorm 和绑定 LM Head，得到 logits。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:20px}.s{font-size:16px}.b{stroke-width:2.5}.f{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="470" rx="22" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="h">从 ID 到 logits：主路形状如何变化</text>
  <rect x="35" y="115" width="145" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="108" y="155" text-anchor="middle" class="t">Token ID</text><text x="108" y="190" text-anchor="middle" class="s">[B,T]</text>
  <path d="M180 168H235" class="f"/><rect x="235" y="115" width="165" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="318" y="155" text-anchor="middle" class="t">Embedding</text><text x="318" y="190" text-anchor="middle" class="s">[B,T,d]</text>
  <path d="M400 168H455" class="f"/><rect x="455" y="82" width="250" height="172" rx="18" fill="#ecfdf5" stroke="#16a34a" class="b"/><text x="580" y="120" text-anchor="middle" class="t">Transformer Block × L</text><rect x="480" y="140" width="200" height="42" rx="10" fill="#fff" stroke="#86efac"/><text x="580" y="167" text-anchor="middle" class="s">Attention + 残差</text><rect x="480" y="194" width="200" height="42" rx="10" fill="#fff" stroke="#86efac"/><text x="580" y="221" text-anchor="middle" class="s">SwiGLU + 残差</text>
  <path d="M705 168H760" class="f"/><rect x="760" y="115" width="165" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="843" y="151" text-anchor="middle" class="t">Final</text><text x="843" y="178" text-anchor="middle" class="t">RMSNorm</text><text x="843" y="204" text-anchor="middle" class="s">[B,T,d]</text>
  <path d="M925 168H980" class="f"/><rect x="980" y="115" width="185" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" class="b"/><text x="1073" y="151" text-anchor="middle" class="t">绑定 LM Head</text><text x="1073" y="179" text-anchor="middle" class="s">× Eᵀ [d,V]</text><text x="1073" y="204" text-anchor="middle" class="s">logits [B,T,V]</text>
  <rect x="460" y="305" width="240" height="92" rx="15" fill="#fff7ed" stroke="#d97706" class="b"/><text x="580" y="340" text-anchor="middle" class="t">每个 Block 外部形状不变</text><text x="580" y="371" text-anchor="middle" class="s">内部轴、可见性和顺序仍必须正确</text>
  <path d="M580 305V260" class="f"/>
</svg>

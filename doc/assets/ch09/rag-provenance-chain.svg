<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">RAG证据provenance链</title><desc id="desc">离线语料版本和权限进入切块索引，在线query经过召回过滤重排和上下文构造，最终答案原子主张回指实际chunk，无证据则拒答。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.f{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="24" fill="#f8fafc"/><text x="45" y="55" class="h">答案中的每条主张，都应回到具体语料版本</text>
<rect x="45" y="105" width="230" height="145" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="160" y="148" text-anchor="middle" class="h">语料版本</text><text x="160" y="187" text-anchor="middle" class="t">doc_id / source / time</text><text x="160" y="220" text-anchor="middle" class="s">权限标签与版本不可省略</text><path d="M275 177H330" class="f"/><rect x="335" y="105" width="230" height="145" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="450" y="148" text-anchor="middle" class="h">切块与索引</text><text x="450" y="187" text-anchor="middle" class="t">chunk边界 / embedding</text><text x="450" y="220" text-anchor="middle" class="s">索引版本 + 权限过滤</text><path d="M565 177H620" class="f"/><rect x="625" y="105" width="250" height="145" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="750" y="148" text-anchor="middle" class="h">召回与重排</text><text x="750" y="187" text-anchor="middle" class="t">query / 分数 / 过滤原因</text><text x="750" y="220" text-anchor="middle" class="s">保存候选而非只留Top-k</text><path d="M875 177H930" class="f"/><rect x="935" y="105" width="220" height="145" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1045" y="148" text-anchor="middle" class="h">上下文构造</text><text x="1045" y="187" text-anchor="middle" class="t">预算 / 去重 / 顺序</text><text x="1045" y="220" text-anchor="middle" class="s">稳定引用ID与截断日志</text>
<path d="M1045 250V330H720" class="f"/><rect x="480" y="335" width="480" height="135" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="720" y="378" text-anchor="middle" class="h">生成：答案原子主张 + 引用</text><text x="720" y="417" text-anchor="middle" class="t">claim₁ → chunk v3:c7　claim₂ → chunk v3:c9</text><text x="720" y="447" text-anchor="middle" class="s">引用必须是实际送入模型的内容</text><path d="M480 402H365" class="f"/><rect x="75" y="335" width="285" height="135" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="217" y="378" text-anchor="middle" class="h">证据不足</text><text x="217" y="417" text-anchor="middle" class="t">abstain / 请求澄清</text><text x="217" y="447" text-anchor="middle" class="s">不能用语言先验补空缺</text><rect x="110" y="535" width="980" height="85" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="570" text-anchor="middle" class="t">故障可定位：库中无文档 → 未召回 → 被过滤 → 被截断 → 未引用 / 曲解</text><text x="600" y="602" text-anchor="middle" class="s">只保存最终答案无法区分这些环节</text></svg>

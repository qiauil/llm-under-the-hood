<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">三种多模态融合接口的状态账</title><desc id="desc">前缀拼接、Cross-Attention和Resampler三行比较视觉状态如何进入语言模型，以及各自的序列长度、KV或memory和主要边界。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.visual{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.text{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.state{fill:#fff7ed;stroke:#ea580c;stroke-width:2}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="45" y="55" class="h">同一图像与文本，融合位置决定状态账</text>
  <rect x="45" y="90" width="1110" height="185" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="70" y="128" class="h">1　前缀 / 交错拼接</text>
  <rect x="75" y="160" width="175" height="65" rx="13" class="visual"/><text x="162" y="200" text-anchor="middle" class="t">视觉 M Token</text><path d="M250 192H300" class="flow"/><rect x="305" y="160" width="175" height="65" rx="13" class="text"/><text x="392" y="200" text-anchor="middle" class="t">文本 T_x Token</text><path d="M480 192H530" class="flow"/><rect x="535" y="145" width="260" height="95" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="665" y="184" text-anchor="middle" class="t">同一LLM自注意力</text><text x="665" y="216" text-anchor="middle" class="s">总长 T_x + M</text><rect x="835" y="145" width="285" height="95" rx="15" class="state"/><text x="977" y="181" text-anchor="middle" class="t">状态：LLM KV增加</text><text x="977" y="214" text-anchor="middle" class="s">视觉Token挤占上下文窗口</text>
  <rect x="45" y="295" width="1110" height="185" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="70" y="333" class="h">2　Cross-Attention</text>
  <rect x="75" y="365" width="175" height="65" rx="13" class="visual"/><text x="162" y="405" text-anchor="middle" class="t">视觉 memory</text><path d="M250 397H430" class="flow"/><rect x="435" y="350" width="255" height="95" rx="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="562" y="389" text-anchor="middle" class="t">Cross-Attention</text><text x="562" y="420" text-anchor="middle" class="s">文本Query读取视觉K/V</text><path d="M305 430V407H430" class="flow"/><rect x="75" y="430" width="230" height="38" rx="10" class="text"/><text x="190" y="455" text-anchor="middle" class="s">文本自注意力仍为 T_x</text><rect x="735" y="350" width="385" height="95" rx="15" class="state"/><text x="927" y="387" text-anchor="middle" class="t">状态：独立视觉memory</text><text x="927" y="418" text-anchor="middle" class="s">另增 T_x × N_v 跨模态计算</text>
  <rect x="45" y="500" width="1110" height="185" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="70" y="538" class="h">3　Resampler / Query Token</text>
  <rect x="75" y="570" width="185" height="65" rx="13" class="visual"/><text x="167" y="610" text-anchor="middle" class="t">N_v 视觉特征</text><path d="M260 602H320" class="flow"/><rect x="325" y="555" width="230" height="95" rx="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="440" y="592" text-anchor="middle" class="t">M个查询重采样</text><text x="440" y="623" text-anchor="middle" class="s">通常 M &lt; N_v</text><path d="M555 602H615" class="flow"/><rect x="620" y="555" width="235" height="95" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="737" y="591" text-anchor="middle" class="t">拼接或Cross-Attend</text><text x="737" y="623" text-anchor="middle" class="s">下游接口成本固定</text><rect x="895" y="555" width="225" height="95" rx="15" class="state"/><text x="1007" y="590" text-anchor="middle" class="t">状态：信息瓶颈</text><text x="1007" y="623" text-anchor="middle" class="s">细节保留需任务实测</text>
  <text x="600" y="725" text-anchor="middle" class="t">比较时同时测：视觉编码器　＋　融合Kernel　＋　Decode状态　＋　任务质量</text>
</svg>

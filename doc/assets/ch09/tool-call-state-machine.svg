<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">工具调用安全状态机</title><desc id="desc">模型提议经Schema、身份授权、确认、隔离执行形成Observation；未知外部状态进入查询对账而非盲目重试。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:27px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.f{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs><rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="45" y="55" class="h">模型只提议；控制面决定能否执行</text>
<g><rect x="45" y="110" width="190" height="105" rx="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="140" y="150" text-anchor="middle" class="h">提议</text><text x="140" y="184" text-anchor="middle" class="s">tool / arguments / call_id</text><path d="M235 162H280" class="f"/><rect x="285" y="110" width="190" height="105" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="380" y="150" text-anchor="middle" class="h">Schema验证</text><text x="380" y="184" text-anchor="middle" class="s">类型 / 范围 / 额外字段</text><path d="M475 162H520" class="f"/><rect x="525" y="110" width="190" height="105" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="620" y="150" text-anchor="middle" class="h">授权与策略</text><text x="620" y="184" text-anchor="middle" class="s">身份 / 资源 / 限额</text><path d="M715 162H760" class="f"/><rect x="765" y="110" width="190" height="105" rx="17" fill="#fef3c7" stroke="#ca8a04" stroke-width="3"/><text x="860" y="150" text-anchor="middle" class="h">必要确认</text><text x="860" y="184" text-anchor="middle" class="s">preview → commit</text><path d="M955 162H1000" class="f"/><rect x="1005" y="110" width="150" height="105" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1080" y="150" text-anchor="middle" class="h">隔离执行</text><text x="1080" y="184" text-anchor="middle" class="s">幂等键 / 截止时间</text></g>
<path d="M1080 215V300H815" class="f"/><rect x="660" y="305" width="310" height="115" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="815" y="348" text-anchor="middle" class="h">结构化 Observation</text><text x="815" y="383" text-anchor="middle" class="s">状态 / 时间 / 截断 / 结果哈希</text><path d="M660 362H575" class="f"/><rect x="315" y="305" width="255" height="115" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="442" y="348" text-anchor="middle" class="h">反馈模型</text><text x="442" y="383" text-anchor="middle" class="s">结果可见，但权限不提升</text>
<path d="M1080 215V500H870" class="bad"/><rect x="555" y="475" width="310" height="115" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="710" y="518" text-anchor="middle" class="h">未知外部状态</text><text x="710" y="553" text-anchor="middle" class="s">timeout ≠ 未执行</text><path d="M555 532H470" class="bad"/><rect x="155" y="475" width="310" height="115" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="310" y="518" text-anchor="middle" class="h">查询 / 对账 / 人工接管</text><text x="310" y="553" text-anchor="middle" class="s">确认状态后才决定补偿或重试</text><rect x="100" y="635" width="1000" height="48" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="667" text-anchor="middle" class="t">validation_error / policy_denied / tool_failed / unknown_external_state 必须可区分</text></svg>

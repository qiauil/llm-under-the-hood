<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Transformer SSM与Hybrid状态账</title><desc id="desc">三列比较训练算法、Decode状态、信息路径与风险，并强调Hybrid逐层相加和同预算验收。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:17px}</style><rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="45" y="55" class="h">架构改变信息路径，也改变Decode时保存的状态</text>
<rect x="45" y="95" width="345" height="480" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="217" y="140" text-anchor="middle" class="h">Transformer</text><text x="75" y="190" class="t">训练 / Prefill</text><text x="75" y="225" class="s">Attention可见图；Dense主项随T²</text><text x="75" y="280" class="t">Decode状态</text><text x="75" y="315" class="s">逐层KV，随历史长度T增长</text><text x="75" y="370" class="t">信息路径</text><text x="75" y="405" class="s">按内容直接读取历史Key/Value</text><text x="75" y="460" class="t">主要代价 / 风险</text><text x="75" y="495" class="s">显存与带宽；可见图仍决定质量</text>
<rect x="427" y="95" width="345" height="480" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="599" y="140" text-anchor="middle" class="h">SSM / Mamba</text><text x="457" y="190" class="t">训练 / Prefill</text><text x="457" y="225" class="s">结构化算法或Selective Scan</text><text x="457" y="280" class="t">Decode状态</text><text x="457" y="315" class="s">固定递归状态 + 局部卷积状态</text><text x="457" y="370" class="t">信息路径</text><text x="457" y="405" class="s">历史压缩进状态，逐步递推</text><text x="457" y="460" class="t">主要代价 / 风险</text><text x="457" y="495" class="s">压缩瓶颈；扫描Kernel与状态迁移</text>
<rect x="810" y="95" width="345" height="480" rx="20" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="982" y="140" text-anchor="middle" class="h">Hybrid</text><text x="840" y="190" class="t">训练 / Prefill</text><text x="840" y="225" class="s">Attention层 + SSM层逐层组合</text><text x="840" y="280" class="t">Decode状态</text><text x="840" y="315" class="s">Attention KV + 所有递归状态</text><text x="840" y="370" class="t">信息路径</text><text x="840" y="405" class="s">周期性内容寻址 + 流式压缩</text><text x="840" y="460" class="t">主要代价 / 风险</text><text x="840" y="495" class="s">资源逐层相加；层比例非通用最优</text>
<rect x="100" y="610" width="1000" height="55" rx="14" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="645" text-anchor="middle" class="t">同预算验收：训练Token / 参数 / 硬件 / Kernel / 长度—质量 / Prefill / Decode / 状态字节</text></svg>

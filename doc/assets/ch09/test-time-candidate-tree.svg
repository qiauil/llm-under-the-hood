<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
 <title id="title">测试时计算的候选生成与选择树</title><desc id="desc">同一问题生成多条候选，一路计算Oracle覆盖，另一路经答案规范化投票或Verifier评分选出最终答案，强调覆盖与选择是两道不同关口。</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:29px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.f{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
 <rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="50" y="55" class="h">额外预算先产生候选，再支付选择成本</text>
 <rect x="55" y="105" width="210" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="160" y="150" text-anchor="middle" class="h">问题 x</text><text x="160" y="185" text-anchor="middle" class="s">固定模型与Prompt协议</text>
 <path d="M265 157H330" class="f"/><rect x="335" y="90" width="300" height="135" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="485" y="132" text-anchor="middle" class="h">生成 N 条候选</text><text x="485" y="170" text-anchor="middle" class="t">y₁, y₂, …, y_N</text><text x="485" y="202" text-anchor="middle" class="s">输出Token、KV、并发槽</text>
 <path d="M635 130H715" class="f"/><rect x="720" y="75" width="425" height="120" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="932" y="117" text-anchor="middle" class="h">Oracle@N：集合里有正确答案吗？</text><text x="932" y="155" text-anchor="middle" class="t">只看覆盖上限，不负责实际选择</text>
 <path d="M485 225V300H290" class="f"/><path d="M485 225V300H780" class="f"/>
 <rect x="70" y="305" width="440" height="145" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="290" y="350" text-anchor="middle" class="h">Self-Consistency</text><text x="290" y="390" text-anchor="middle" class="t">canon(answer) → 频数 / 平票规则</text><text x="290" y="425" text-anchor="middle" class="s">风险：共享偏差、解析失败</text>
 <rect x="550" y="305" width="460" height="145" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="780" y="350" text-anchor="middle" class="h">Best-of-N / Verifier</text><text x="780" y="390" text-anchor="middle" class="t">规则、单测、Outcome / Process分数</text><text x="780" y="425" text-anchor="middle" class="s">风险：误选、失配、Reward Hacking</text>
 <path d="M290 450V525H515" class="f"/><path d="M780 450V525H665" class="f"/><rect x="455" y="530" width="270" height="95" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="590" y="570" text-anchor="middle" class="h">最终答案</text><text x="590" y="603" text-anchor="middle" class="s">实际正确率 / 延迟 / 成本</text>
 <rect x="75" y="650" width="1050" height="45" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="680" text-anchor="middle" class="t">Oracle上升但最终不升 → 诊断解析、候选相关性与选择器，而非只加N</text>
</svg>

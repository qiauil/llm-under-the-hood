<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">长上下文的三种长度与四条验收线</title>
  <desc id="desc">上方区分入口允许的配置长度、训练覆盖的位置范围和固定协议下的有效上下文长度，箭头使用虚线表示不能自动推出。下方并列Attention计算、KV状态、位置分布和任务利用四条证据线，汇合为联合报告。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="58" class="h">“支持多长”要拆成三问，再通过四条证据线</text>
  <rect x="55" y="105" width="300" height="150" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="205" y="150" text-anchor="middle" class="h">T_cfg</text><text x="205" y="188" text-anchor="middle" class="t">入口允许多少 Token？</text><text x="205" y="224" text-anchor="middle" class="s">含 Prompt 与输出预算</text>
  <path d="M355 180H438" class="dash"/><text x="397" y="163" text-anchor="middle" class="s">不推出</text>
  <rect x="445" y="105" width="300" height="150" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="595" y="150" text-anchor="middle" class="h">T_train</text><text x="595" y="188" text-anchor="middle" class="t">训练覆盖多少位置？</text><text x="595" y="224" text-anchor="middle" class="s">含预训练与后训练分布</text>
  <path d="M745 180H828" class="dash"/><text x="787" y="163" text-anchor="middle" class="s">不推出</text>
  <rect x="835" y="105" width="310" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="990" y="150" text-anchor="middle" class="h">T_eff(τ, E)</text><text x="990" y="188" text-anchor="middle" class="t">任务上可靠利用多远？</text><text x="990" y="224" text-anchor="middle" class="s">绑定阈值 τ 与协议 E</text>
  <text x="55" y="318" class="h">四条并列验收线</text>
  <rect x="55" y="355" width="245" height="165" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="177" y="400" text-anchor="middle" class="h">计算</text><text x="177" y="440" text-anchor="middle" class="t">可见对 / Kernel</text><text x="177" y="477" text-anchor="middle" class="s">Full、Window、Sparse</text>
  <rect x="335" y="355" width="245" height="165" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="457" y="400" text-anchor="middle" class="h">状态</text><text x="457" y="440" text-anchor="middle" class="t">KV payload / 驻留</text><text x="457" y="477" text-anchor="middle" class="s">页表、碎片、通信另计</text>
  <rect x="615" y="355" width="245" height="165" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="737" y="400" text-anchor="middle" class="h">位置</text><text x="737" y="440" text-anchor="middle" class="t">坐标 / 相位分布</text><text x="737" y="477" text-anchor="middle" class="s">训练范围与 scaling</text>
  <rect x="895" y="355" width="250" height="165" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="1020" y="400" text-anchor="middle" class="h">利用</text><text x="1020" y="440" text-anchor="middle" class="t">检索 / 聚合 / 推理</text><text x="1020" y="477" text-anchor="middle" class="s">位置 × 长度 × 难度</text>
  <path d="M177 520V580H540" class="line"/><path d="M457 520V580H540" class="line"/><path d="M737 520V580H660" class="line"/><path d="M1020 520V580H660" class="line"/>
  <rect x="450" y="585" width="300" height="85" rx="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="600" y="622" text-anchor="middle" class="h">联合报告</text><text x="600" y="653" text-anchor="middle" class="s">长度声明 + 资源 + 质量 + 协议</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图像到Visual Token的shape流水线</title><desc id="desc">输入图像经真实预处理、Patch网格、视觉编码器和连接器，依次从像素张量变为视觉特征和语言侧表示。图中标出B、H、W、C、Nv、dv、M和d，并强调预处理、二维位置和Token预算必须记录。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:29px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f8fafc"/><text x="50" y="58" class="h">先固定真实输入，再计算Visual Token</text>
  <rect x="45" y="115" width="200" height="180" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="145" y="160" text-anchor="middle" class="h">原始图像</text><text x="145" y="205" text-anchor="middle" class="t">I</text><text x="145" y="245" text-anchor="middle" class="t">[B, H, W, C]</text>
  <path d="M245 205H300" class="flow"/><rect x="305" y="115" width="210" height="180" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="410" y="157" text-anchor="middle" class="h">真实预处理</text><text x="410" y="199" text-anchor="middle" class="t">缩放 / 裁剪 / 补齐</text><text x="410" y="237" text-anchor="middle" class="s">多图、动态分块也在此</text><text x="410" y="268" text-anchor="middle" class="s">得到 H′ × W′</text>
  <path d="M515 205H570" class="flow"/><rect x="575" y="115" width="220" height="180" rx="20" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="685" y="157" text-anchor="middle" class="h">Patch网格</text><text x="685" y="199" text-anchor="middle" class="t">P_h × P_w</text><text x="685" y="237" text-anchor="middle" class="t">N_v 个Patch</text><text x="685" y="268" text-anchor="middle" class="s">保留二维位置结构</text>
  <path d="M795 205H850" class="flow"/><rect x="855" y="115" width="300" height="180" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1005" y="157" text-anchor="middle" class="h">视觉编码器 E_v</text><text x="1005" y="205" text-anchor="middle" class="t">V ∈ R^[B,N_v,d_v]</text><text x="1005" y="245" text-anchor="middle" class="s">冻结或训练必须声明</text>
  <path d="M1005 295V350H735" class="flow"/><rect x="500" y="355" width="470" height="150" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="735" y="400" text-anchor="middle" class="h">连接器 C：投影或重采样</text><text x="735" y="445" text-anchor="middle" class="t">Ṽ ∈ R^[B,M,d]</text><text x="735" y="477" text-anchor="middle" class="s">仅投影：M=N_v　重采样：M可小于N_v</text>
  <path d="M500 430H395" class="flow"/><rect x="70" y="355" width="320" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230" y="400" text-anchor="middle" class="h">语言侧融合</text><text x="230" y="445" text-anchor="middle" class="t">前缀 / Cross-Attention</text><text x="230" y="477" text-anchor="middle" class="s">融合位置决定Attention与KV账</text>
  <rect x="120" y="555" width="960" height="75" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="588" text-anchor="middle" class="t">复现实验必须同时记录</text><text x="600" y="616" text-anchor="middle" class="s">预处理后的尺寸与网格　•　二维位置规则　•　N_v / M　•　冻结策略　•　融合层</text>
</svg>

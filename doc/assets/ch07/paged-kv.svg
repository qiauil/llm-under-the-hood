<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Paged KV的逻辑块、Block Table与物理块映射</title>
  <desc id="desc">块大小4，10个Token按逻辑位置连续分成三个逻辑块，Block Table依次映射到物理块7、1、3。位置u等于8位于逻辑块2偏移0，因此访问物理块3偏移0；最后物理块剩余两个空槽。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.box{stroke:#334155;stroke-width:2}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="55" class="h">逻辑连续，不要求物理连续</text>
  <text x="60" y="105" class="t">10 个 Token，q<tspan baseline-shift="sub" font-size="15">blk</tspan> = 4</text>
  <g text-anchor="middle">
    <text x="130" y="155" class="s">逻辑位置</text>
    <g class="box" fill="#dbeafe"><rect x="210" y="125" width="80" height="60"/><rect x="290" y="125" width="80" height="60"/><rect x="370" y="125" width="80" height="60"/><rect x="450" y="125" width="80" height="60"/><rect x="555" y="125" width="80" height="60"/><rect x="635" y="125" width="80" height="60"/><rect x="715" y="125" width="80" height="60"/><rect x="795" y="125" width="80" height="60"/><rect x="900" y="125" width="80" height="60" fill="#fed7aa"/><rect x="980" y="125" width="80" height="60" fill="#fed7aa"/></g>
    <g class="t"><text x="250" y="164">0</text><text x="330" y="164">1</text><text x="410" y="164">2</text><text x="490" y="164">3</text><text x="595" y="164">4</text><text x="675" y="164">5</text><text x="755" y="164">6</text><text x="835" y="164">7</text><text x="940" y="164">8</text><text x="1020" y="164">9</text></g>
    <text x="370" y="220" class="s">逻辑块 0</text><text x="715" y="220" class="s">逻辑块 1</text><text x="980" y="220" class="s">逻辑块 2</text>
  </g>
  <rect x="250" y="265" width="700" height="95" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" class="h">Block Table</text>
  <text x="600" y="340" text-anchor="middle" class="t">logical [0, 1, 2]  →  physical [7, 1, 3]</text>
  <g class="flow"><path d="M370 225V265"/><path d="M715 225V265"/><path d="M980 225V265"/></g>
  <text x="60" y="435" class="h">物理块池中的三块</text>
  <g text-anchor="middle">
    <text x="240" y="480" class="t">Physical 7</text><text x="600" y="480" class="t">Physical 1</text><text x="960" y="480" class="t">Physical 3</text>
    <g class="box" fill="#bbf7d0"><rect x="80" y="500" width="80" height="65"/><rect x="160" y="500" width="80" height="65"/><rect x="240" y="500" width="80" height="65"/><rect x="320" y="500" width="80" height="65"/><rect x="440" y="500" width="80" height="65"/><rect x="520" y="500" width="80" height="65"/><rect x="600" y="500" width="80" height="65"/><rect x="680" y="500" width="80" height="65"/><rect x="800" y="500" width="80" height="65" fill="#fed7aa"/><rect x="880" y="500" width="80" height="65" fill="#fed7aa"/></g>
    <g class="box" fill="#e2e8f0" stroke-dasharray="7 6"><rect x="960" y="500" width="80" height="65"/><rect x="1040" y="500" width="80" height="65"/></g>
    <g class="s"><text x="120" y="540">0</text><text x="200" y="540">1</text><text x="280" y="540">2</text><text x="360" y="540">3</text><text x="480" y="540">4</text><text x="560" y="540">5</text><text x="640" y="540">6</text><text x="720" y="540">7</text><text x="840" y="540">u=8</text><text x="920" y="540">9</text><text x="1000" y="540">空</text><text x="1080" y="540">空</text></g>
  </g>
  <path d="M940 185V240H1030V500" class="flow"/><text x="1060" y="250" class="s">u=8</text><text x="1060" y="278" class="s">j=2, r=0</text>
  <rect x="170" y="620" width="860" height="60" rx="14" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="657" text-anchor="middle" class="t" fill="#b91c1c">分页降低连续大块需求；末块空槽、块表和间接寻址仍有代价</text>
</svg>

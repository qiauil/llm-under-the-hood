<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prefill与Decode的shape、KV动作和服务指标对比</title>
  <desc id="desc">左侧Prefill一次处理多个已知Prompt位置，写入整段KV并主要进入TTFT；右侧Decode每请求每轮输入一个新Token，用当前Query读取不断增长的历史KV，并主要进入ITL和TPOT。底部说明两阶段瓶颈必须由目标shape实测。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.box{stroke:#334155;stroke-width:2}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="55" class="h">同一组权重，两种执行颗粒度</text>
  <rect x="45" y="90" width="530" height="530" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="625" y="90" width="530" height="530" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="310" y="137" text-anchor="middle" class="h">Prefill：多个已知位置并行</text>
  <text x="890" y="137" text-anchor="middle" class="h">Decode：每请求每轮 1 个新位置</text>
  <g text-anchor="middle">
    <rect x="90" y="180" width="440" height="78" rx="16" fill="#bfdbfe" class="box"/><text x="310" y="213" class="t">输入 shape：B × Tₚ × d</text><text x="310" y="242" class="s">完整 Prompt 或一个 chunk</text>
    <path d="M310 258V305" class="flow"/>
    <rect x="90" y="310" width="440" height="95" rx="16" fill="#dbeafe" class="box"/><text x="310" y="344" class="t">Attention：Prompt 内可见位置对</text><text x="310" y="374" class="s">线性层按 BTₚ；稠密主项含 Tₚ²</text><text x="310" y="397" class="s">为全部 Prompt 位置写入 KV</text>
    <path d="M310 405V452" class="flow"/>
    <rect x="120" y="457" width="380" height="75" rx="16" fill="#dcfce7" class="box"/><text x="310" y="490" class="t">直接用户指标：TTFT</text><text x="310" y="518" class="s">还包含排队与回传</text>
    <text x="310" y="575" class="t">调节：Prompt / chunk Token 预算</text>
  </g>
  <g text-anchor="middle">
    <rect x="670" y="180" width="440" height="78" rx="16" fill="#fed7aa" class="box"/><text x="890" y="213" class="t">输入 shape：B × 1 × d</text><text x="890" y="242" class="s">下一 Token 依赖上一步实际选择</text>
    <path d="M890 258V305" class="flow"/>
    <rect x="670" y="310" width="440" height="95" rx="16" fill="#ffedd5" class="box"/><text x="890" y="344" class="t">Attention：1 个新 Query 读历史 KV</text><text x="890" y="374" class="s">历史长度 T 持续增长</text><text x="890" y="397" class="s">只为新位置追加 K/V</text>
    <path d="M890 405V452" class="flow"/>
    <rect x="700" y="457" width="380" height="75" rx="16" fill="#dcfce7" class="box"/><text x="890" y="490" class="t">直接用户指标：ITL / TPOT</text><text x="890" y="518" class="s">还受动态 Batch 与 KV 读取影响</text>
    <text x="890" y="575" class="t">调节：活跃 Batch / KV 容量</text>
  </g>
  <rect x="125" y="646" width="950" height="50" rx="13" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="678" text-anchor="middle" class="t">“Prefill 计算受限、Decode 带宽受限”是待测起点，不是无条件定律</text>
</svg>

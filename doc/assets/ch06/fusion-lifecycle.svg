<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">分离与融合 Kernel 的中间量生命周期</title><desc id="desc">分离路线把 u 和 g 写回 HBM，融合路线让它们留在片上。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.b{stroke:#334155;stroke-width:2}.a{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="55" y="60" class="h">分离：中间量跨 Kernel 存活</text>
  <rect x="50" y="90" width="1100" height="220" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <g text-anchor="middle"><rect class="b" x="80" y="160" width="100" height="65" rx="10" fill="#dbeafe"/><text x="130" y="202" class="t">x</text>
  <rect class="b" x="240" y="135" width="180" height="115" rx="14" fill="#fed7aa"/><text x="330" y="182" class="t">仿射 Kernel</text><text x="330" y="217" class="s">u=ax+b</text>
  <rect class="b" x="480" y="135" width="180" height="115" rx="14" fill="#fde68a"/><text x="570" y="182" class="t">Sigmoid</text><text x="570" y="217" class="s">g=σ(u)</text>
  <rect class="b" x="720" y="135" width="180" height="115" rx="14" fill="#bbf7d0"/><text x="810" y="182" class="t">乘法 Kernel</text><text x="810" y="217" class="s">y=ug</text>
  <rect class="b" x="1000" y="160" width="100" height="65" rx="10" fill="#dcfce7"/><text x="1050" y="202" class="t">y</text></g>
  <path class="a" d="M180 192H240"/><path class="a" d="M420 170H480"/><path class="a" d="M660 170H720"/><path class="a" d="M900 192H1000"/>
  <path d="M420 225V280H480V225M660 225V280H720V225" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 7"/>
  <text x="450" y="300" class="s" text-anchor="middle" fill="#b91c1c">u 写/读 HBM</text><text x="690" y="300" class="s" text-anchor="middle" fill="#b91c1c">g 写/读 HBM</text><text x="1010" y="285" class="t" fill="#b91c1c">7Ns</text>
  <text x="55" y="370" class="h">融合：中间量只在片上存活</text>
  <rect x="50" y="400" width="830" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <g text-anchor="middle"><rect class="b" x="85" y="465" width="100" height="65" rx="10" fill="#dbeafe"/><text x="135" y="507" class="t">x</text>
  <rect class="b" x="270" y="430" width="390" height="135" rx="16" fill="#bfdbfe"/><text x="465" y="470" class="t">一个融合 Kernel</text><text x="465" y="510" class="s">u → g → y 均留在寄存器 / 片上存储</text><text x="465" y="540" class="s">只读 x，最终写 y</text>
  <rect class="b" x="745" y="465" width="100" height="65" rx="10" fill="#dcfce7"/><text x="795" y="507" class="t">y</text></g>
  <path class="a" d="M185 497H270"/><path class="a" d="M660 497H745"/><text x="710" y="565" class="t" fill="#1d4ed8">2Ns</text>
  <rect x="920" y="405" width="230" height="180" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="452" class="t" text-anchor="middle" fill="#b91c1c">不是免费午餐</text><text x="945" y="495" class="s">• 寄存器压力</text><text x="945" y="530" class="s">• Occupancy</text><text x="945" y="565" class="s">• Spill 回慢存储</text>
</svg>

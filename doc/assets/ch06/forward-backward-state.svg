<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">标准与 Flash Attention 的前反向状态</title><desc id="desc">标准路线保存 S/P，Flash 路线保存 O 与行统计量并在反向重算局部 tile。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.b{stroke:#334155;stroke-width:2}.a{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="55" y="60" class="h">标准路线：保存大中间量</text>
  <rect x="45" y="90" width="1110" height="210" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <g text-anchor="middle"><rect class="b" x="90" y="145" width="190" height="95" rx="14" fill="#fed7aa"/><text x="185" y="185" class="t">前向</text><text x="185" y="220" class="s">QK → S → P → O</text>
  <rect class="b" x="405" y="130" width="300" height="125" rx="14" fill="#fee2e2"/><text x="555" y="175" class="t">跨边界保存到 HBM</text><text x="555" y="215" class="s">S / P：T × T 规模</text>
  <rect class="b" x="835" y="145" width="230" height="95" rx="14" fill="#fed7aa"/><text x="950" y="185" class="t">反向</text><text x="950" y="220" class="s">读 S/P → ∇Q,K,V</text></g><path class="a" d="M280 192H405"/><path class="a" d="M705 192H835"/>
  <text x="55" y="365" class="h">Flash 路线：保存小状态，反向重算局部 Tile</text>
  <rect x="45" y="395" width="1110" height="210" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <g text-anchor="middle"><rect class="b" x="90" y="450" width="190" height="95" rx="14" fill="#bfdbfe"/><text x="185" y="490" class="t">分块前向</text><text x="185" y="525" class="s">局部 S/P 用后丢弃</text>
  <rect class="b" x="405" y="435" width="300" height="125" rx="14" fill="#dcfce7"/><text x="555" y="480" class="t">跨边界保存</text><text x="555" y="520" class="s">O + 每行 L（或 m,ℓ）</text>
  <rect class="b" x="835" y="435" width="230" height="125" rx="14" fill="#bfdbfe"/><text x="950" y="475" class="t">分块反向</text><text x="950" y="510" class="s">重算局部 S/P</text><text x="950" y="540" class="s">累加 ∇Q,K,V</text></g><path class="a" d="M280 497H405"/><path class="a" d="M705 497H835"/>
  <text x="600" y="635" class="t" text-anchor="middle">少保存、少 HBM 读回；多重算——墙钟方向由目标 shape 与硬件决定</text>
</svg>

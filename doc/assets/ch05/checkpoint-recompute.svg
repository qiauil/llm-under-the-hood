<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">无激活检查点与逐 Block 检查点的生命周期</title>
  <desc id="desc">上方无检查点路线在前向过程中依次保存四个 Block 的内部激活，直到对应反向才释放。下方检查点路线只保留 Block 边界，前向后内部激活已释放；反向到达每个 Block 前重新执行该 Block 的前向，再立即求梯度并释放重算结果。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e67e00"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:16px}.s{font-size:13px;fill:#46525e}.f{fill:#eaf2ff;stroke:#2166f3;stroke-width:2}.save{fill:#e8f8f0;stroke:#009b68;stroke-width:2}.re{fill:#fff3e3;stroke:#e67e00;stroke-width:2}.b{fill:#f2ebff;stroke:#7449d8;stroke-width:2}.a{stroke:#e67e00;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="980" height="500" rx="18" fill="#f7f9fb"/><text x="490" y="38" text-anchor="middle" class="h">检查点缩短激活存活期，但反向前要重放前向</text>
  <text x="26" y="86" class="t" font-weight="700">无检查点：内部激活跨越前向—反向保存</text><path d="M105 150H914" class="a"/>
  <g class="f"><rect x="110" y="112" width="120" height="72" rx="10"/><rect x="250" y="112" width="120" height="72" rx="10"/><rect x="390" y="112" width="120" height="72" rx="10"/><rect x="530" y="112" width="120" height="72" rx="10"/></g><g class="b"><rect x="670" y="112" width="100" height="72" rx="10"/><rect x="790" y="112" width="100" height="72" rx="10"/></g>
  <g class="t" text-anchor="middle"><text x="170" y="140">F Block 1</text><text x="170" y="164">保存内部 A₁</text><text x="310" y="140">F Block 2</text><text x="310" y="164">保存内部 A₂</text><text x="450" y="140">F Block 3</text><text x="450" y="164">保存内部 A₃</text><text x="590" y="140">F Block 4</text><text x="590" y="164">保存内部 A₄</text><text x="720" y="140">B 4→3</text><text x="720" y="164">逐步释放</text><text x="840" y="140">B 2→1</text><text x="840" y="164">逐步释放</text></g>
  <path d="M170 194V224H590V194" stroke="#009b68" stroke-width="3" fill="none"/><text x="380" y="244" text-anchor="middle" class="s">峰值附近：A₁…A₄ 同时存活</text>
  <text x="26" y="296" class="t" font-weight="700">逐 Block 检查点：只存边界 K，反向到达时重放</text><path d="M105 366H914" class="a"/>
  <g class="save"><rect x="110" y="328" width="104" height="72" rx="10"/><rect x="228" y="328" width="104" height="72" rx="10"/><rect x="346" y="328" width="104" height="72" rx="10"/></g><g class="re"><rect x="478" y="328" width="120" height="72" rx="10"/><rect x="612" y="328" width="120" height="72" rx="10"/></g><g class="b"><rect x="746" y="328" width="120" height="72" rx="10"/></g>
  <g class="t" text-anchor="middle"><text x="162" y="356">边界 K₀</text><text x="162" y="380">内部激活释放</text><text x="280" y="356">边界 K₁</text><text x="280" y="380">内部激活释放</text><text x="398" y="356">边界 K₂…</text><text x="398" y="380">继续前向</text><text x="538" y="356">重放 F Block 4</text><text x="538" y="380">临时恢复内部激活</text><text x="672" y="356">B Block 4</text><text x="672" y="380">立即消费并释放</text><text x="806" y="356">重放下一块</text><text x="806" y="380">重复到 Block 1</text></g>
  <text x="490" y="442" text-anchor="middle" class="s">省下的是跨前反向保存的内部激活；代价是 Cᵣₑ、可能重复的通信，以及 RNG/副作用正确性约束。</text><text x="490" y="468" text-anchor="middle" class="s">示意图不代表峰值必然按保存量同比下降：参数、workspace、通信 buffer 和重放瞬时激活仍要计入。</text>
</svg>

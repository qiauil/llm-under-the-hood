<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">FSDP单元的参数与梯度生命周期</title>
  <desc id="desc">一个FSDP单元在前向前从参数分片All-Gather成完整参数，前向后可选reshard，反向前再次All-Gather，反向后用Reduce-Scatter只保留梯度分片，最后在分片状态上更新。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker><style>.t{font:700 23px system-ui,sans-serif;fill:#172033}.h{font:700 15px system-ui,sans-serif;fill:#172033}.b{font:12px system-ui,sans-serif;fill:#334155}.s{font:10.5px system-ui,sans-serif;fill:#475569}.arr{stroke:#d97706;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="470" rx="20" fill="#f8fafc"/><text x="550" y="38" text-anchor="middle" class="t">一个 FSDP 单元：常驻分片，按计算窗口临时物化</text>
  <path d="M55 210H1045" stroke="#cbd5e1" stroke-width="4"/>
  <g stroke-width="2"><rect x="30" y="135" width="145" height="130" rx="14" fill="#eef2ff" stroke="#4f46e5"/><rect x="205" y="110" width="155" height="180" rx="14" fill="#eff6ff" stroke="#2563eb"/><rect x="390" y="135" width="135" height="130" rx="14" fill="#ecfdf5" stroke="#059669"/><rect x="555" y="110" width="155" height="180" rx="14" fill="#eff6ff" stroke="#2563eb"/><rect x="740" y="110" width="165" height="180" rx="14" fill="#fff7ed" stroke="#ea580c"/><rect x="935" y="135" width="135" height="130" rx="14" fill="#ecfdf5" stroke="#059669"/></g>
  <g text-anchor="middle"><text x="102" y="165" class="h">常驻</text><text x="102" y="193" class="b">参数 G/q</text><text x="102" y="218" class="b">optimizer G/q</text><text x="102" y="246" class="s">分片 DTensor</text><text x="282" y="143" class="h">前向前</text><text x="282" y="174" class="b">All-Gather</text><text x="282" y="199" class="b">临时完整 G</text><text x="282" y="231" class="s">可预取下一单元</text><text x="282" y="260" class="s">过早会抬高峰值</text><text x="457" y="165" class="h">前向</text><text x="457" y="198" class="b">完整参数</text><text x="457" y="225" class="b">本 rank 数据</text><text x="457" y="248" class="s">产生激活</text><text x="632" y="143" class="h">前向后</text><text x="632" y="174" class="b">reshard?</text><text x="632" y="203" class="b">是：释放非本地参数</text><text x="632" y="231" class="s">反向前需再次 All-Gather</text><text x="632" y="260" class="s">否：少一次聚合，延长存活</text><text x="822" y="143" class="h">反向后</text><text x="822" y="174" class="b">Reduce-Scatter</text><text x="822" y="203" class="b">归约 + 梯度分片 G/q</text><text x="822" y="231" class="s">释放完整参数/梯度</text><text x="822" y="260" class="s">Token 加权口径仍须正确</text><text x="1002" y="165" class="h">更新</text><text x="1002" y="198" class="b">参数 G/q</text><text x="1002" y="225" class="b">梯度 G/q</text><text x="1002" y="248" class="s">本地 optimizer 分片</text></g>
  <path d="M175 200H202M360 200H387M525 200H552M710 200H737M905 200H932" class="arr"/>
  <rect x="95" y="345" width="910" height="72" rx="14" fill="#fff" stroke="#94a3b8"/><text x="550" y="374" text-anchor="middle" class="b">粒度就是通信边界：大单元消息少但临时峰值高；小单元易重叠但 collective 更频繁</text><text x="550" y="400" text-anchor="middle" class="s">真实峰值还要加激活、预取重叠、communication buffer、workspace 与分配器保留</text>
</svg>

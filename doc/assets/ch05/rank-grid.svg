<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">32-GPU 玩具网格中 rank 11 的并行通信组</title>
  <desc id="desc">四个节点各有八个 GPU。TP 为每四个连续 rank 一组，CP 把同节点两组中的对应 TP rank 配对；rank 11 的 TP 组是 8 到 11，CP 伙伴是 15，PP 伙伴是 3，DP 伙伴是 27。TP 和 CP 留在节点内，PP 与 DP 跨节点。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:16px}.s{font-size:13px;fill:#46525e}.node{fill:#fff;stroke:#66717c;stroke-width:2}.gpu{fill:#edf0f2;stroke:#9aa3ab}.tp{fill:#eaf2ff;stroke:#2166f3;stroke-width:2}.cp{fill:#e8f8f0;stroke:#009b68;stroke-width:2}.focus{fill:#fff3e3;stroke:#e67e00;stroke-width:3}.pp{stroke:#7449d8;stroke-width:3;stroke-dasharray:8 6;fill:none}.dp{stroke:#d33c55;stroke-width:3;stroke-dasharray:3 6;fill:none}</style></defs>
  <rect width="980" height="540" rx="18" fill="#f7f9fb"/><text x="490" y="38" text-anchor="middle" class="h">先定义通信组，再把高频组放进高速域</text>
  <g transform="translate(32,72)">
    <g><rect width="210" height="328" rx="14" class="node"/><text x="105" y="30" text-anchor="middle" class="t">节点 0 · rank 0–7</text></g>
    <g transform="translate(226,0)"><rect width="210" height="328" rx="14" class="node"/><text x="105" y="30" text-anchor="middle" class="t">节点 1 · rank 8–15</text></g>
    <g transform="translate(452,0)"><rect width="210" height="328" rx="14" class="node"/><text x="105" y="30" text-anchor="middle" class="t">节点 2 · rank 16–23</text></g>
    <g transform="translate(678,0)"><rect width="210" height="328" rx="14" class="node"/><text x="105" y="30" text-anchor="middle" class="t">节点 3 · rank 24–31</text></g>
    <g class="t" text-anchor="middle">
      <g transform="translate(20,52)"><rect width="78" height="48" rx="8" class="gpu"/><text x="39" y="30">r0</text><rect x="92" width="78" height="48" rx="8" class="gpu"/><text x="131" y="30">r1</text><rect y="62" width="78" height="48" rx="8" class="gpu"/><text x="39" y="92">r2</text><rect x="92" y="62" width="78" height="48" rx="8" class="focus"/><text x="131" y="92">r3 · PP</text><rect y="148" width="78" height="48" rx="8" class="gpu"/><text x="39" y="178">r4</text><rect x="92" y="148" width="78" height="48" rx="8" class="gpu"/><text x="131" y="178">r5</text><rect y="210" width="78" height="48" rx="8" class="gpu"/><text x="39" y="240">r6</text><rect x="92" y="210" width="78" height="48" rx="8" class="gpu"/><text x="131" y="240">r7</text></g>
      <g transform="translate(246,52)"><rect width="78" height="48" rx="8" class="tp"/><text x="39" y="30">r8</text><rect x="92" width="78" height="48" rx="8" class="tp"/><text x="131" y="30">r9</text><rect y="62" width="78" height="48" rx="8" class="tp"/><text x="39" y="92">r10</text><rect x="92" y="62" width="78" height="48" rx="8" class="focus"/><text x="131" y="92">r11</text><rect y="148" width="78" height="48" rx="8" class="gpu"/><text x="39" y="178">r12</text><rect x="92" y="148" width="78" height="48" rx="8" class="gpu"/><text x="131" y="178">r13</text><rect y="210" width="78" height="48" rx="8" class="gpu"/><text x="39" y="240">r14</text><rect x="92" y="210" width="78" height="48" rx="8" class="cp"/><text x="131" y="240">r15 · CP</text></g>
      <g transform="translate(472,52)"><rect width="78" height="48" rx="8" class="gpu"/><text x="39" y="30">r16</text><rect x="92" width="78" height="48" rx="8" class="gpu"/><text x="131" y="30">r17</text><rect y="62" width="78" height="48" rx="8" class="gpu"/><text x="39" y="92">r18</text><rect x="92" y="62" width="78" height="48" rx="8" class="gpu"/><text x="131" y="92">r19</text><rect y="148" width="78" height="48" rx="8" class="gpu"/><text x="39" y="178">r20</text><rect x="92" y="148" width="78" height="48" rx="8" class="gpu"/><text x="131" y="178">r21</text><rect y="210" width="78" height="48" rx="8" class="gpu"/><text x="39" y="240">r22</text><rect x="92" y="210" width="78" height="48" rx="8" class="gpu"/><text x="131" y="240">r23</text></g>
      <g transform="translate(698,52)"><rect width="78" height="48" rx="8" class="gpu"/><text x="39" y="30">r24</text><rect x="92" width="78" height="48" rx="8" class="gpu"/><text x="131" y="30">r25</text><rect y="62" width="78" height="48" rx="8" class="gpu"/><text x="39" y="92">r26</text><rect x="92" y="62" width="78" height="48" rx="8" class="focus"/><text x="131" y="92">r27 · DP</text><rect y="148" width="78" height="48" rx="8" class="gpu"/><text x="39" y="178">r28</text><rect x="92" y="148" width="78" height="48" rx="8" class="gpu"/><text x="131" y="178">r29</text><rect y="210" width="78" height="48" rx="8" class="gpu"/><text x="39" y="240">r30</text><rect x="92" y="210" width="78" height="48" rx="8" class="gpu"/><text x="131" y="240">r31</text></g>
    </g>
    <path d="M377 166V282" stroke="#009b68" stroke-width="3"/><path d="M151 166H377" class="pp"/><path d="M377 166H829" class="dp"/>
  </g>
  <g class="s"><text x="42" y="438">rank 11 坐标：(DP=0, PP=1, CP=0, EP=0, TP=3)</text><text x="42" y="466">TP 组 {8,9,10,11}：蓝色、节点内连续</text><text x="42" y="492">CP 组 {11,15}：绿色实线、节点内；PP {3,11}：紫色虚线；DP {11,27}：红色点线、跨节点</text><text x="42" y="518">示例只验证分组与拓扑映射，不表示真实链路带宽或最优布局。</text></g>
</svg>

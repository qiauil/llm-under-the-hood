<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">五种 collective 的输入与输出布局</title>
  <desc id="desc">用统一四rank图比较Broadcast的一源复制、All-Reduce的多源归约复制、Reduce-Scatter的归约后分片、All-Gather的分片收集复制和All-to-All的源目的个性化交换。</desc>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d97706"/></marker><style>.t{font:700 24px system-ui,sans-serif;fill:#172033}.h{font:700 17px system-ui,sans-serif;fill:#172033}.b{font:13px system-ui,sans-serif;fill:#334155}.s{font:11px system-ui,sans-serif;fill:#475569}.r{font:700 11px system-ui,sans-serif;fill:#fff}.arr{stroke:#d97706;stroke-width:1.8;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" rx="20" fill="#f8fafc"/><text x="600" y="38" text-anchor="middle" class="t">先看布局：同一组 rank，五种不同信息流</text>
  <g transform="translate(20,70)">
    <rect width="370" height="245" rx="16" fill="#fff" stroke="#4f46e5" stroke-width="2"/><text x="185" y="28" text-anchor="middle" class="h">Broadcast：一源复制</text>
    <g transform="translate(42,60)"><circle cx="35" cy="35" r="25" fill="#4f46e5"/><circle cx="250" cy="15" r="25" fill="#94a3b8"/><circle cx="250" cy="75" r="25" fill="#94a3b8"/><circle cx="250" cy="135" r="25" fill="#94a3b8"/><g class="r" text-anchor="middle"><text x="35" y="39">r2:A</text><text x="250" y="19">r0</text><text x="250" y="79">r1</text><text x="250" y="139">r3</text></g><path d="M60 35L220 16M60 35H220M60 35L220 132" class="arr"/></g>
    <text x="185" y="222" text-anchor="middle" class="s">无归约；所有 rank 最终得 A</text>
  </g>
  <g transform="translate(415,70)">
    <rect width="370" height="245" rx="16" fill="#fff" stroke="#059669" stroke-width="2"/><text x="185" y="28" text-anchor="middle" class="h">All-Reduce：归约后复制</text>
    <g transform="translate(45,65)"><g fill="#2563eb"><circle cx="20" cy="20" r="20"/><circle cx="20" cy="70" r="20"/><circle cx="20" cy="120" r="20"/></g><g class="r" text-anchor="middle"><text x="20" y="24">A</text><text x="20" y="74">B</text><text x="20" y="124">C</text></g><path d="M45 20L125 70M45 70H125M45 120L125 70" class="arr"/><circle cx="155" cy="70" r="29" fill="#059669"/><text x="155" y="74" text-anchor="middle" class="r">Σ</text><path d="M184 70H230" class="arr"/><g fill="#059669"><rect x="235" y="25" width="46" height="28" rx="8"/><rect x="235" y="58" width="46" height="28" rx="8"/><rect x="235" y="91" width="46" height="28" rx="8"/></g><g class="r" text-anchor="middle"><text x="258" y="44">Σ</text><text x="258" y="77">Σ</text><text x="258" y="110">Σ</text></g></g>
    <text x="185" y="222" text-anchor="middle" class="s">每个 rank 都得到同一完整归约结果</text>
  </g>
  <g transform="translate(810,70)">
    <rect width="370" height="245" rx="16" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="185" y="28" text-anchor="middle" class="h">Reduce-Scatter：归约后分片</text>
    <g transform="translate(35,70)"><rect x="0" y="0" width="70" height="30" rx="7" fill="#2563eb"/><rect x="0" y="45" width="70" height="30" rx="7" fill="#2563eb"/><rect x="0" y="90" width="70" height="30" rx="7" fill="#2563eb"/><g class="r" text-anchor="middle"><text x="35" y="20">A0 A1 A2</text><text x="35" y="65">B0 B1 B2</text><text x="35" y="110">C0 C1 C2</text></g><path d="M75 15L145 60M75 60H145M75 105L145 60" class="arr"/><circle cx="172" cy="60" r="27" fill="#ea580c"/><text x="172" y="64" text-anchor="middle" class="r">Σ</text><path d="M200 60H240" class="arr"/><g><rect x="245" y="0" width="52" height="30" rx="7" fill="#ef4444"/><rect x="245" y="45" width="52" height="30" rx="7" fill="#22c55e"/><rect x="245" y="90" width="52" height="30" rx="7" fill="#8b5cf6"/></g><g class="r" text-anchor="middle"><text x="271" y="20">Σ0</text><text x="271" y="65">Σ1</text><text x="271" y="110">Σ2</text></g></g>
    <text x="185" y="222" text-anchor="middle" class="s">归约未取消；只改变结果放置</text>
  </g>
  <g transform="translate(215,340)">
    <rect width="370" height="245" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="185" y="28" text-anchor="middle" class="h">All-Gather：收集分片后复制</text>
    <g transform="translate(38,72)"><g><rect x="0" y="0" width="50" height="30" rx="7" fill="#ef4444"/><rect x="0" y="45" width="50" height="30" rx="7" fill="#22c55e"/><rect x="0" y="90" width="50" height="30" rx="7" fill="#8b5cf6"/></g><g class="r" text-anchor="middle"><text x="25" y="20">A</text><text x="25" y="65">B</text><text x="25" y="110">C</text></g><path d="M55 15L130 60M55 60H130M55 105L130 60" class="arr"/><g transform="translate(145,5)"><rect width="135" height="35" rx="8" fill="#dbeafe" stroke="#2563eb"/><rect y="42" width="135" height="35" rx="8" fill="#dbeafe" stroke="#2563eb"/><rect y="84" width="135" height="35" rx="8" fill="#dbeafe" stroke="#2563eb"/><g class="b" text-anchor="middle"><text x="67" y="23">A | B | C</text><text x="67" y="65">A | B | C</text><text x="67" y="107">A | B | C</text></g></g></g>
    <text x="185" y="222" text-anchor="middle" class="s">无归约；每 rank 物化完整分片集合</text>
  </g>
  <g transform="translate(610,340)">
    <rect width="370" height="245" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="185" y="28" text-anchor="middle" class="h">All-to-All：源—目的个性化交换</text>
    <g transform="translate(42,58)"><g fill="#2563eb"><circle cx="25" cy="20" r="20"/><circle cx="25" cy="65" r="20"/><circle cx="25" cy="110" r="20"/><circle cx="25" cy="155" r="20"/></g><g fill="#7c3aed"><circle cx="260" cy="20" r="20"/><circle cx="260" cy="65" r="20"/><circle cx="260" cy="110" r="20"/><circle cx="260" cy="155" r="20"/></g><g class="r" text-anchor="middle"><text x="25" y="24">s0</text><text x="25" y="69">s1</text><text x="25" y="114">s2</text><text x="25" y="159">s3</text><text x="260" y="24">d0</text><text x="260" y="69">d1</text><text x="260" y="114">d2</text><text x="260" y="159">d3</text></g><path d="M46 20L238 65M46 65L238 155M46 110L238 20M46 155L238 110" class="arr"/></g>
    <text x="185" y="222" text-anchor="middle" class="s">无归约；每个目的收到专属分片</text>
  </g>
  <text x="600" y="625" text-anchor="middle" class="b">语义只规定结果布局；ring、tree、分层算法和链路流量属于物理实现</text>
</svg>

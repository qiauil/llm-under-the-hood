<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Context Parallelism 中 K/V 环传与在线 softmax 合并</title>
  <desc id="desc">四个 rank 固定各自的本地 Query 和在线状态，K/V 块沿环传递。每处理一个块，都用共同最大值重缩放旧状态和新块的最大值、指数和与加权输出；四轮后每个 Query 分片得到覆盖全部可见 Key 的精确输出。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e67e00"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#46525e}.r{fill:#eaf2ff;stroke:#2166f3;stroke-width:2}.kv{fill:#e8f8f0;stroke:#009b68;stroke-width:2}.st{fill:#fff3e3;stroke:#e67e00;stroke-width:2}.a{stroke:#e67e00;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="960" height="470" rx="18" fill="#f7f9fb"/><text x="480" y="38" text-anchor="middle" class="h">Q 固定在本地，K/V 绕环；统计量跨块合并</text>
  <path d="M250 170C250 70 710 70 710 170M710 170C710 350 250 350 250 170" class="a"/>
  <g><circle cx="250" cy="170" r="58" class="r"/><circle cx="710" cy="170" r="58" class="r"/><circle cx="710" cy="330" r="58" class="r"/><circle cx="250" cy="330" r="58" class="r"/>
    <text x="250" y="158" text-anchor="middle" class="t">rank 0</text><text x="250" y="182" text-anchor="middle" class="s">Q₀ 固定</text><text x="710" y="158" text-anchor="middle" class="t">rank 1</text><text x="710" y="182" text-anchor="middle" class="s">Q₁ 固定</text><text x="710" y="318" text-anchor="middle" class="t">rank 2</text><text x="710" y="342" text-anchor="middle" class="s">Q₂ 固定</text><text x="250" y="318" text-anchor="middle" class="t">rank 3</text><text x="250" y="342" text-anchor="middle" class="s">Q₃ 固定</text></g>
  <g class="kv"><rect x="394" y="86" width="172" height="54" rx="10"/><rect x="610" y="226" width="172" height="54" rx="10"/><rect x="394" y="356" width="172" height="54" rx="10"/><rect x="178" y="226" width="172" height="54" rx="10"/></g>
  <g class="t" text-anchor="middle"><text x="480" y="119">K/V 块 0→1</text><text x="696" y="259">K/V 块 1→2</text><text x="480" y="389">K/V 块 2→3</text><text x="264" y="259">K/V 块 3→0</text></g>
  <rect x="375" y="185" width="210" height="126" rx="14" class="st"/><text x="480" y="215" text-anchor="middle" class="t">每 rank 的在线状态</text><text x="480" y="242" text-anchor="middle" class="s">m′ = max(m, mⱼ)</text><text x="480" y="265" text-anchor="middle" class="s">ℓ′ = eᵐ⁻ᵐ′ℓ + eᵐʲ⁻ᵐ′ℓⱼ</text><text x="480" y="288" text-anchor="middle" class="s">o′ 同尺度合并，最终 y=o/ℓ</text>
  <text x="480" y="442" text-anchor="middle" class="s">经过 c 轮后，每个本地 Query 只保留自己的输出，但其归一化覆盖全部可见 Key。</text>
</svg>

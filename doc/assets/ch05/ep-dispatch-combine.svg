<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">专家并行的 Dispatch—Compute—Combine 往返路径</title>
  <desc id="desc">本地 Token 经 Router 产生专家编号和权重，按目的 rank 分桶后通过可变 split All-to-All 发送；各 rank 按本地专家重新分组计算，再通过第二次 All-to-All 返回原源 rank，按保存的 Token 索引反置换并按路由权重合并。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e67e00"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#46525e}.b{fill:#eaf2ff;stroke:#2166f3;stroke-width:2}.g{fill:#e8f8f0;stroke:#009b68;stroke-width:2}.o{fill:#fff3e3;stroke:#e67e00;stroke-width:2}.p{fill:#f2ebff;stroke:#7449d8;stroke-width:2}.a{stroke:#e67e00;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="980" height="460" rx="18" fill="#f7f9fb"/><text x="490" y="38" text-anchor="middle" class="h">Token 离开源 rank 后，必须按索引和权重回来</text>
  <rect x="26" y="142" width="132" height="112" rx="12" class="b"/><text x="92" y="171" text-anchor="middle" class="t">本地 Token</text><text x="92" y="198" text-anchor="middle" class="s">h₀ h₁ h₂ h₃</text><text x="92" y="225" text-anchor="middle" class="s">保存原索引</text>
  <rect x="196" y="142" width="132" height="112" rx="12" class="p"/><text x="262" y="171" text-anchor="middle" class="t">Router</text><text x="262" y="198" text-anchor="middle" class="s">专家编号 + 权重</text><text x="262" y="225" text-anchor="middle" class="s">按目的 rank 分桶</text>
  <rect x="366" y="96" width="152" height="204" rx="12" class="o"/><text x="442" y="128" text-anchor="middle" class="t">Dispatch</text><text x="442" y="154" text-anchor="middle" class="s">可变 split All-to-All</text><text x="442" y="190" text-anchor="middle" class="s">源 0 → [2,1,1,0]</text><text x="442" y="216" text-anchor="middle" class="s">源 1 → [0,3,1,0]</text><text x="442" y="242" text-anchor="middle" class="s">源 2 → [1,0,2,1]</text><text x="442" y="268" text-anchor="middle" class="s">源 3 → [0,1,0,3]</text>
  <rect x="556" y="82" width="174" height="232" rx="12" class="g"/><text x="643" y="114" text-anchor="middle" class="t">专家所有者</text><text x="643" y="142" text-anchor="middle" class="s">按本地专家再分组</text><rect x="581" y="162" width="124" height="42" rx="8" fill="#fff" stroke="#009b68"/><text x="643" y="189" text-anchor="middle" class="s">Grouped GEMM</text><rect x="581" y="220" width="124" height="42" rx="8" fill="#fff" stroke="#009b68"/><text x="643" y="247" text-anchor="middle" class="s">容量 / 热点检查</text><text x="643" y="289" text-anchor="middle" class="s">输出仍为 d 维</text>
  <rect x="768" y="96" width="162" height="204" rx="12" class="o"/><text x="849" y="128" text-anchor="middle" class="t">Combine</text><text x="849" y="154" text-anchor="middle" class="s">第二次 All-to-All</text><text x="849" y="190" text-anchor="middle" class="s">返回原源 rank</text><text x="849" y="220" text-anchor="middle" class="s">按原索引反置换</text><text x="849" y="250" text-anchor="middle" class="s">按路由权重合并</text><text x="849" y="278" text-anchor="middle" class="s">恢复序列顺序</text>
  <path d="M158 198H196M328 198H366M518 198H556M730 198H768" class="a"/>
  <text x="490" y="356" text-anchor="middle" class="t">两次交换的对象是路由副本，不是原 Token 数；本地 nᵢᵢ 不进入网络。</text>
  <rect x="184" y="382" width="612" height="48" rx="10" fill="#fff" stroke="#68727d"/><text x="490" y="412" text-anchor="middle" class="s">性能判断需同时记录 split 矩阵、每专家 Token 数、丢弃/填充、各 rank 通信和计算时间。</text>
</svg>

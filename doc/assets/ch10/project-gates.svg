<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">最终课程项目的四个Gate</title>
  <desc id="desc">冻结的模型与manifest依次进入结构、资源、训练并行、部署优化四个Gate。每个Gate都产生可保存的证据并成为下一Gate输入；没有目标硬件时，第三和第四Gate保持未运行，不能把前两个Gate的通过写成端到端完成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px sans-serif;fill:#172033}.h{font:700 20px sans-serif;fill:#172033}.t{font:15px sans-serif;fill:#172033}.small{font:14px sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{stroke-width:2.5}
    </style>
  </defs>
  <rect width="1100" height="560" rx="24" fill="#f8fafc"/>
  <text x="50" y="50" class="title">同一份 manifest 穿过四个 Gate，证据才能首尾相接</text>

  <rect x="55" y="90" width="990" height="72" rx="16" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="80" y="120" class="h">冻结输入</text>
  <text x="200" y="120" class="t">模型/Tokenizer revision · 配置与权重 shape · 数据或请求 trace · 硬件/软件 · 质量门槛</text>
  <text x="200" y="146" class="small">任何变更生成新配置 ID，不覆盖失败点</text>

  <rect x="55" y="220" width="220" height="210" rx="18" fill="#dbeafe" stroke="#2563eb" class="card"/>
  <text x="78" y="255" class="h">Gate 1  结构</text>
  <text x="78" y="291" class="t">源码 + 配置 + 权重 shape</text>
  <text x="78" y="325" class="small">Q/K/V、位置、Norm、MLP</text>
  <text x="78" y="353" class="small">残差与 GQA 整除闭合</text>
  <rect x="78" y="380" width="170" height="30" rx="9" fill="#ffffff" stroke="#2563eb"/>
  <text x="96" y="401" class="small">产物：结构/shape 表</text>

  <rect x="310" y="220" width="220" height="210" rx="18" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="333" y="255" class="h">Gate 2  资源</text>
  <text x="333" y="291" class="t">参数 + FLOPs + 状态 + KV</text>
  <text x="333" y="325" class="small">解析整数与 numel 对照</text>
  <text x="333" y="353" class="small">逻辑 payload ≠ 物理峰值</text>
  <rect x="333" y="380" width="170" height="30" rx="9" fill="#ffffff" stroke="#16a34a"/>
  <text x="350" y="401" class="small">产物：资源账本 JSON</text>

  <rect x="565" y="220" width="220" height="210" rx="18" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="588" y="255" class="h">Gate 3  训练/并行</text>
  <text x="588" y="291" class="t">布局约束 + 正确性 + 测量</text>
  <text x="588" y="325" class="small">通信、空泡、显存、Step</text>
  <text x="588" y="353" class="small">无目标集群：not_run</text>
  <rect x="588" y="380" width="170" height="30" rx="9" fill="#ffffff" stroke="#ea580c"/>
  <text x="606" y="401" class="small">产物：候选与原始 trace</text>

  <rect x="820" y="220" width="225" height="210" rx="18" fill="#f3e8ff" stroke="#7c3aed" class="card"/>
  <text x="843" y="255" class="h">Gate 4  部署/优化</text>
  <text x="843" y="291" class="t">固定 trace 的单变量 A/B</text>
  <text x="843" y="325" class="small">质量 + SLO + 内存 + Kernel</text>
  <text x="843" y="353" class="small">无真实服务：not_run</text>
  <rect x="843" y="380" width="175" height="30" rx="9" fill="#ffffff" stroke="#7c3aed"/>
  <text x="860" y="401" class="small">产物：性能与质量报告</text>

  <path d="M165 162 L165 220" class="line"/>
  <path d="M275 325 L310 325" class="line"/>
  <path d="M530 325 L565 325" class="line"/>
  <path d="M785 325 L820 325" class="line"/>

  <rect x="55" y="475" width="990" height="48" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="82" y="505" class="h">边界：</text>
  <text x="160" y="505" class="t">前两个 Gate 通过但后两个为 not_run，只能报告“结构与资源已验证”，不能报告“端到端实验完成”。</text>
</svg>
